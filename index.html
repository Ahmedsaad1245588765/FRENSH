<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قسم الفرنسي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14264f;--navy2:#0d1a38;--gold:#c19a4b;--bg:#f1f3f6;--line:#dde2ea;--red:#b3261e;--ok:#177a45;--mut:#5d6882}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1b2438;font-family:Cairo,system-ui,sans-serif;line-height:1.7}
.top{background:var(--navy2);color:#cfd6e6;font-size:.85rem;padding:5px 16px;text-align:center}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--gold);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;cursor:pointer;flex:1;min-width:230px}
.brand svg{width:40px;height:48px}
.brand b{display:block;font:600 1.25rem/1.2 Fraunces,Georgia,serif;color:var(--navy);direction:ltr}
.brand small{color:var(--mut)}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav a{cursor:pointer;padding:6px 12px;border-radius:6px;color:var(--navy);font-weight:600}
nav a:hover{background:var(--bg)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 140px}
button{font:inherit;border:0;border-radius:8px;padding:7px 18px;background:var(--navy);color:#fff;cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
button.sec{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
button.del{background:var(--red)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
h2,h3{margin:0}
.fr{font-family:Fraunces,Georgia,serif;direction:ltr;text-align:left}
.mut{color:var(--mut)}
.hero{border-radius:14px;color:#fff;padding:70px 28px 44px;margin-bottom:34px;background:linear-gradient(90deg,rgba(13,26,56,.93),rgba(13,26,56,.55)),var(--navy2)}
.hero p{margin:0;color:#e8d9b5}
.hero h2{font-size:clamp(2.2rem,7vw,3.8rem);font-weight:600;line-height:1.1;margin:10px 0 20px;max-width:14ch}
.hero h2::after{content:"";display:block;width:80px;height:4px;background:var(--gold);margin-top:14px}
.hero .w:hover{background:var(--gold);color:var(--navy2)}
.hero button{background:var(--gold);color:var(--navy2)}
.hero .sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.sh{font-size:1.4rem;font-weight:800;color:var(--navy);margin:6px 0 16px;border-inline-start:5px solid var(--gold);padding-inline-start:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.item{cursor:pointer}
.tile{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,38,79,.15);transition:box-shadow .2s}
.tile:hover{box-shadow:0 10px 26px rgba(20,38,79,.22)}
.cv{height:140px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#2f5096) center/cover}
.cv em{font:italic 600 4.5rem Fraunces,serif;color:rgba(193,154,75,.85)}
.cv[style*="url"] em{display:none}
.tb{padding:12px 16px;border-top:3px solid var(--gold);font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item:not(.tile){display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;border-inline-start:5px solid var(--gold);padding:14px 18px;margin:10px 0;font-size:1.1rem;font-weight:600;box-shadow:0 1px 3px rgba(20,38,79,.1)}
.item:not(.tile):hover{box-shadow:0 6px 18px rgba(20,38,79,.2)}
.item span{flex:1}
.lesson-stars{display:inline-flex;gap:1px;color:var(--gold);font-size:1.05rem;letter-spacing:1px;white-space:nowrap;text-shadow:0 0 12px rgba(255,209,102,.35)}
.lesson-stars .empty{color:rgba(255,255,255,.22);text-shadow:none}
.n{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:Fraunces,serif}
.text{background:#fff;border-radius:12px;padding:28px;font-size:1.4rem;line-height:2;white-space:pre-wrap;box-shadow:0 1px 3px rgba(20,38,79,.12)}
.tts-sentence{border-radius:7px;transition:background .2s ease,box-shadow .2s ease;color:inherit}
.tts-sentence.reading{background:rgba(255,209,102,.28);box-shadow:0 0 0 3px rgba(255,209,102,.12);color:inherit!important;text-shadow:none}
.w{cursor:pointer;border-radius:4px}.w:hover{background:#f3e3b8}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:12px 0}
.q{background:#fff;border-radius:12px;padding:20px;margin:14px 0;font-size:1.1rem;box-shadow:0 1px 3px rgba(20,38,79,.12)}
.essay{min-height:130px}.score{display:inline-block;padding:3px 10px;border-radius:999px;background:#e8f5ee;color:var(--ok);font-weight:800}.danger{color:var(--red)}
.q>.fr b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:.9rem;margin-inline-end:8px}
.opt{display:block;width:100%;text-align:start;background:var(--bg);color:#1b2438;border-radius:8px;margin:8px 0;padding:10px 16px}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--red);color:#fff}
dialog{border:0;border-radius:14px;width:min(92vw,480px);padding:22px}
dialog::backdrop{background:rgba(13,26,56,.6)}
label{display:block;margin:10px 0;font-weight:600}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:8px;margin-top:3px;background:#fff}
footer{background:var(--navy2);color:#aab4cc;text-align:center;padding:22px 16px;border-top:3px solid var(--gold)}
#sheet{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,460px);background:var(--navy);color:#fff;border-radius:14px;border-top:4px solid var(--gold);padding:18px;text-align:center;box-shadow:0 12px 40px rgba(13,26,56,.5);display:none;z-index:50}
#sheet .f{font-size:1.8rem}
#sheet .a{font-size:1.5rem;color:var(--gold);margin:2px 0 10px;min-height:2.4rem}
#sheet .b{color:#cfd6e6;font-size:.95rem;margin-bottom:8px;min-height:1.4rem}
#sheet button{background:var(--gold);color:var(--navy2)}
#sheet .sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

async function askJSON(prompt, tries = 2, parts = null) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const t = (await examModel.generateContent(parts ? [prompt, ...parts] : prompt)).response.text();
      try { return JSON.parse(t); } catch { const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1)); throw new Error("رد غير مفهوم من الذكاء الاصطناعي"); }

}

function makeLessonFabDraggable(el,key,name){
  if(!el)return;

  const setXY=(left,top)=>{const r=el.getBoundingClientRect(),w=r.width||48,h=r.height||48;left=Math.max(8,Math.min(left,window.innerWidth-w-8));top=Math.max(8,Math.min(top,window.innerHeight-h-8));el.style.left=`${left}px`;el.style.top=`${top}px`;el.style.right="auto";el.style.bottom="auto";el.style.transform="none";return {left,top};};
  try{const saved=JSON.parse(localStorage.getItem(key)||"null");if(Number.isFinite(saved?.left)&&Number.isFinite(saved?.top)){lessonFabUserMoved[name]=true;el.dataset.userMoved="true";el.style.left=`${saved.left}px`;el.style.top=`${saved.top}px`;el.style.right="auto";el.style.bottom="auto";el.style.transform="none";requestAnimationFrame(()=>{const p=setXY(saved.left,saved.top);save();});}}catch{}
  let pointer=null,startX=0,startY=0,originX=0,originY=0,moved=false,suppressClick=false;
  el.addEventListener("pointerdown",e=>{if(e.button!==undefined&&e.button!==0)return;pointer=e.pointerId;startX=e.clientX;startY=e.clientY;const r=el.getBoundingClientRect();originX=r.left;originY=r.top;moved=false;try{el.setPointerCapture(pointer);}catch{};});
  el.addEventListener("pointermove",e=>{if(pointer!==e.pointerId)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;el.classList.add("dragging");const p=setXY(originX+dx,originY+dy);lessonFabUserMoved[name]=true;el.dataset.userMoved="true";try{localStorage.setItem(key,JSON.stringify(p));}catch{};e.preventDefault();});
  const finish=e=>{if(pointer!==e.pointerId)return;if(moved)suppressClick=true;pointer=null;el.classList.remove("dragging");};
  el.addEventListener("pointerup",finish);el.addEventListener("pointercancel",finish);
  el.addEventListener("click",e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false;}},true);
  window.addEventListener("resize",()=>{if(!lessonFabUserMoved[name])return;const r=el.getBoundingClientRect();const p=setXY(r.left,r.top);try{localStorage.setItem(key,JSON.stringify(p));}catch{}});
}

};

async function lessons(sub) {

  const starsFor = pct => pct >= 90 ? 3 : pct >= 75 ? 2 : pct >= 50 ? 1 : 0;
  const bestStars = {}; atts.forEach(a => { const s = Number.isFinite(Number(a.stars)) ? Number(a.stars) : starsFor(Number(a.percent) || 0); bestStars[a.lessonId] = Math.max(bestStars[a.lessonId] ?? 0, s); });

    <div id="lessonList">${ls.map((l, i) => `<div class="item fr${locked[i] ? " locked" : ""}" data-id="${l.id}"><b class="n">${locked[i] ? "🔒" : i + 1}</b><span>${esc(l.title)}</span>${bestStars[l.id] ? starsHtml(bestStars[l.id]) : ""}${(l.examCount || 0) ? (passed(l) ? `<small class="badge">✓ نجحت${best[l.id] !== undefined ? " — " + best[l.id] + "%" : ""}</small>` : best[l.id] !== undefined ? `<small class="badge">آخر نتيجة ${best[l.id]}% — المطلوب ${need(l)}%</small>` : `<small class="badge">اختبار — المطلوب ${need(l)}%</small>`) : ""}${editor ? `<button class="sec" data-edit-lesson="${l.id}">تعديل</button>${admin ? `<button class="del" data-del="${l.id}">حذف</button>` : ""}` : ""}</div>`).join("") || `<p class="mut">مفيش دروس لسه.</p>`}</div>`;

async function delLesson(id, quiet) {

  for (const im of await list(`lessons/${id}/images`)) await deleteDoc(doc(db, `lessons/${id}/images`, im.id));

async function recomputeGates(subjectId) {
  const ls = await list("lessons", "subjectId", subjectId);
  let gate = "";
  for (const l of ls) {
    if ((l.prevId || "") !== gate) { try { await updateDoc(doc(db, "lessons", l.id), { prevId: gate }); l.prevId = gate; } catch (e) { console.warn("gate", e); } }
    if ((l.examCount || 0) > 0) gate = l.id;
  }
}

async function generateExam(l, c, mode = "text") {
  const mcqN = c.mcq || 0, tfN = c.tf || 0, essayN = c.essay || 0, matchN = c.match || 0, fillN = c.fill || 0, count = mcqN + tfN + essayN + matchN + fillN;

  const scope = mode === "grammar"
    ? `ضع اختبارًا في القواعد النحوية فقط لدرس القواعد التالي: أسئلة تطبيقية على القاعدة أو القواعد الموجودة في نص الدرس (التصريف، اختيار الصيغة الصحيحة، تكوين الجملة، تصحيح الخطأ، استعمال الأزمنة والضمائر...) وبجمل جديدة غير منسوخة من النص. لا تسأل عن معلومات أو مفردات أو قصص في النص خارج القاعدة نفسها. كل سؤال لازم يختبر تطبيق القاعدة.`
    : `ضع اختبارًا يعتمد على فهم نص الدرس ومعلوماته ومفرداته فقط، وليس اختبارًا في القواعد النحوية أو الأزمنة. لا تسأل عن تصريف أو تعريف قاعدة أو اختيار زمن.`;
  const dist = [mcqN && `${mcqN} سؤال اختيار من متعدد (type "mcq")`, tfN && `${tfN} سؤال صح/غلط (type "tf")`, essayN && `${essayN} سؤال مقالي (type "essay")`, matchN && `${matchN} سؤال وصل (type "match")`, fillN && `${fillN} سؤال أكمل (type "fill")`].filter(Boolean).join("، ");
  const prompt = `أنت أستاذ لغة فرنسية. ${scope} الاختبار من ${count} سؤالًا بمستوى طلاب جامعيين.\nالتوزيع: ${dist}.\nالقواعد: الأسئلة والاختيارات بالفرنسية. الاختيار من متعدد: 4 اختيارات وإجابة واحدة صحيحة، و"answer" هو رقم الاختيار الصحيح ويبدأ من 0. صح/غلط: "q" عبارة فرنسية، و"options" فارغة، و"answer" يساوي 0 إذا كانت صحيحة و1 إذا كانت خاطئة. المقالي: سؤال يطلب إجابة قصيرة بالفرنسية، بدون إجابة نموذجية. وصل (type "match"): "q" تعليمات قصيرة بالفرنسية، و"pairs" من 3 إلى 5 أزواج {"l":"العنصر","r":"المقابل الصحيح"} بحيث يكون لكل عنصر مقابل واحد صحيح فقط ولا تتكرر المقابلات. أكمل (type "fill"): "q" جملة فرنسية فيها فراغ أو أكثر (من 1 إلى 3) يُكتب كل فراغ هكذا "____"، ويمكن وضع الفعل أو الكلمة المطلوبة بين قوسين بعد الفراغ كتلميح، و"blanks" قائمة بالإجابة الصحيحة لكل فراغ بالترتيب وبنفس عدد الفراغات تمامًا. لكل سؤال ما عدا المقالي أضف "explanation": شرح بالفرنسية البسيطة (A2-B1) يوضح الإجابة. لا تكرر الأسئلة.\nعنوان الدرس: ${l.title}\nنص الدرس: ${(l.text || "").slice(0, 20000)}${gp ? "\nنقاط القواعد المستخرجة:\n" + gp : ""}\nأعد JSON فقط: {"questions":[{"type":"mcq","q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."},{"type":"match","q":"...","pairs":[{"l":"...","r":"..."}],"explanation":"..."},{"type":"fill","q":"Je ____ (aller) au marché.","blanks":["vais"],"explanation":"..."}]}`;
  const j = await askJSON(prompt), out = [];
  const arr = Array.isArray(j) ? j : (j.questions || j.exam || j.items || j.data || Object.values(j).find(Array.isArray) || []);
  for (const x of arr) {
    const rt = String(x.type || x.kind || "").toLowerCase();
    const type = /match|pair|وصل/.test(rt) ? "match" : /fill|blank|gap|complete|أكمل|فراغ/.test(rt) ? "fill" : /essay|open|written|مقال/.test(rt) ? "essay" : /tf|true|false|bool|صح/.test(rt) ? "tf" : "mcq";
    const q = String(x.q || x.question || x.text || x.statement || "").trim();
    if (!q) continue;
    const explanation = String(x.explanation || x.why || x.rationale || "").trim();
    if (type === "match") {
      const pairs = (x.pairs || x.matches || []).map(p => ({ l: String(p.l ?? p.left ?? p.a ?? "").trim(), r: String(p.r ?? p.right ?? p.b ?? "").trim() })).filter(p => p.l && p.r).slice(0, 6);
      if (pairs.length < 2) continue;

    if (type === "fill") {
      const n = (q.match(/_{2,}/g) || []).length, blanks = (Array.isArray(x.blanks) ? x.blanks : Array.isArray(x.answers) ? x.answers : [x.answer ?? x.blank]).map(b => String(b ?? "").trim()).filter(Boolean);
      if (!n || blanks.length !== n) continue;

    }
    const a = x.answer ?? x.correct ?? x.correct_answer ?? x.correctAnswer ?? x.correctIndex ?? x.correct_index;
    if (type === "essay") { out.push({ type, q, options: [], answer: 0 }); continue; }
    if (a === undefined || a === null) continue;
    if (type === "tf") {
      const t = String(a).trim().toLowerCase(), ans = typeof a === "boolean" ? (a ? 0 : 1) : (/^(1|false|faux|غلط|خطأ)$/.test(t) ? 1 : 0);

      continue;
    }
    const options = (x.options || x.choices || x.answers || []).map(o => String(o?.text ?? o).trim()).filter(Boolean);
    let idx = -1;
    if (typeof a === "number") idx = a;
    else { const t = String(a).trim(); idx = /^\d+$/.test(t) ? Number(t) : /^[A-Da-d]$/.test(t) ? t.toUpperCase().charCodeAt(0) - 65 : options.findIndex(o => o === t); }
    if (options.length < 2 || !Number.isInteger(idx) || idx < 0 || idx >= options.length) continue;
    out.push({ type, q, options, answer: idx, explanation });

  return out.slice(0, count);
}

let ttsRun = 0, ttsState = "idle", ttsQueue = [], ttsIdx = 0, ttsBtn = null;
const TTS_LABEL = "🔊 تشغيل الدرس";
const ttsNote = m => { const e = document.querySelector("#ttsStatus"); if (e) e.textContent = m || ""; };
function ttsChunks(text) {
  const clean = String(text || "").replace(/<[^>]*>/g, " ").replace(/^\s*(?:[-•*]|\d+[.)])\s+/gm, "").replace(/[ \t]+/g, " ");
  const parts = clean.split(/(?<=[.!?…:;])\s+|\n+/).map(x => x.trim()).filter(Boolean), out = [];
  let cur = "";

    if (p.length > 170) {
      if (cur) { out.push(cur); cur = ""; }
      let w = ""; for (const x of p.split(" ")) { if (w && (w + " " + x).length > 170) { out.push(w); w = x; } else w = w ? w + " " + x : x; }
      if (w) out.push(w);
    } else { if (cur) out.push(cur); cur = p; }
  }
  if (cur) out.push(cur);
  return out;
}
function speechKey(text) { return String(text || "").replace(/\s+/g, " ").trim().toLowerCase(); }
function highlightSpeechChunk(text) {
  document.querySelectorAll(".tts-sentence.reading").forEach(e => e.classList.remove("reading"));
  const key = speechKey(text); if (!key) return;
  const target = [...document.querySelectorAll("#txt .tts-sentence")].find(e => {
    const value = speechKey(e.dataset.sentence || e.textContent);
    return value === key || value.includes(key) || key.includes(value);
  });

}

function stopLessonSpeech() {

  if (ttsBtn) ttsBtn.textContent = TTS_LABEL;
  ttsNote("");
}
function ttsPlay(run) {

  ttsNote(vn);
  const dog = setTimeout(() => { if (run === ttsRun) ttsNote("⏳ الصوت بيتأخر. غالبًا صوت المتصفح الفرنسي أونلاين أو مش متاح. جرّب Edge، أو نزّل صوت فرنسي من إعدادات الويندوز (Time & Language ← Speech)"); }, 3000);
  u.onstart = () => { clearTimeout(dog); ttsNote(vn); };

function speakLesson(text, button) {
  if (!("speechSynthesis" in window)) return alert("النطق الصوتي غير مدعوم في هذا المتصفح");
  ttsBtn = button;
  if (ttsState === "playing") { ttsRun++; speechSynthesis.cancel(); ttsState = "paused"; button.textContent = "▶ استكمال الدرس"; return; }
  if (ttsState === "paused") { ttsState = "playing"; button.textContent = "⏸ إيقاف مؤقت"; ttsPlay(++ttsRun); return; }
  ttsQueue = ttsChunks(text); if (!ttsQueue.length) return;
  ttsIdx = 0; speechSynthesis.cancel(); ttsState = "playing"; button.textContent = "⏸ إيقاف مؤقت";
  const run = ++ttsRun;
  if (speechSynthesis.getVoices().length) setTimeout(() => ttsPlay(run), 80);
  else { let done = false; const go = () => { if (!done) { done = true; ttsPlay(run); } }; speechSynthesis.addEventListener("voiceschanged", go, { once: true }); setTimeout(go, 600); }

const pdfScriptCache = {};
function loadPdfScript(src, test) {
  if (test()) return Promise.resolve();
  return pdfScriptCache[src] || (pdfScriptCache[src] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src;
    s.onload = () => test() ? res() : rej(new Error("تعذر تحميل مكتبة PDF"));
    s.onerror = () => { delete pdfScriptCache[src]; rej(new Error("تعذر تحميل مكتبة PDF. تأكد من الإنترنت.")); };
    document.head.appendChild(s);
  }));
}

async function downloadLessonPdf(l, btn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "⏳ جاري تجهيز الملف...";
  let frame = null;
  try {
    await Promise.all([
      loadPdfScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", () => !!window.html2canvas),
      loadPdfScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", () => !!(window.jspdf && window.jspdf.jsPDF))
    ]);
    // نجهّز محتوى الملف
    const root = document.createElement("div");
    root.id = "pdfExport";
    root.innerHTML = `<div class="pdf-banner"><div class="pdf-frame"><div class="pdf-orn"><b></b><i class="s"></i><i></i><i class="s"></i><b class="r"></b></div><h1 class="pdf-title" dir="auto">${esc(l.title)}</h1><div class="pdf-flag"><i style="background:#2456bd"></i><i style="background:#fff"></i><i style="background:#e0444d"></i></div></div></div>`;
    const body = $("#txt").cloneNode(true);
    body.removeAttribute("id");
    body.querySelectorAll(".sti,.pti,.paragraph-tools").forEach(x => x.remove());
    body.querySelectorAll(".reading,.pair-active,.word-focus").forEach(x => x.classList.remove("reading", "pair-active", "word-focus"));
    root.appendChild(body);
    ["important-words", "grammar-points"].forEach(c => {
      const el = app.querySelector("." + c);
      if (el && !el.querySelector("p.mut")) root.appendChild(el.cloneNode(true));
    });

    // نصوّر الملف داخل iframe خفيف (أسرع بكتير من تصوير الصفحة الكاملة)
    const pageCss = [...document.querySelectorAll("style")].map(x => x.textContent).join("\n");
    frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;left:-10000px;top:0;width:718px;height:900px;border:0;pointer-events:none";
    document.body.appendChild(frame);
    const fd = frame.contentDocument;
    fd.open();
    fd.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet"><style>${pageCss}</style><style>html,body{margin:0!important;padding:0!important;background:#fff!important;overflow:visible!important;min-height:0!important;animation:none!important}body:before,body:after{display:none!important}${PDF_CSS}</style></head><body>${root.outerHTML}</body></html>`);
    fd.close();
    await new Promise(res => { let done = false; const fin = () => { if (!done) { done = true; res(); } }; if (fd.readyState === "complete") setTimeout(fin, 50); else frame.addEventListener("load", fin); setTimeout(fin, 5000); });
    if (fd.fonts && fd.fonts.ready) await Promise.race([fd.fonts.ready, new Promise(r => setTimeout(r, 3000))]);
    await Promise.all([...fd.images].map(im => im.decode ? im.decode().catch(() => {}) : null));
    const rootEl = fd.getElementById("pdfExport");
    frame.style.height = Math.max(900, rootEl.scrollHeight) + "px";

    // وحدات الصفحة (كل وحدة بتتحط كاملة في الصفحة)
    const units = [rootEl.querySelector(".pdf-banner")];
    rootEl.querySelectorAll(":scope > .text > .lsec > *").forEach(c => {
      const rows = c.querySelectorAll(".bilingual-row");
      if (rows.length && !c.classList.contains("lans")) rows.forEach(r => units.push(r)); else units.push(c);
    });
    rootEl.querySelectorAll(":scope > .important-words").forEach(el => units.push(el));
    rootEl.querySelectorAll(":scope > .grammar-points").forEach(el => { const h = el.querySelector("h3"); if (h) units.push(h); el.querySelectorAll(".grammar-card").forEach(x => units.push(x)); });

    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    const M = 10, W = 190, PH = 277, GAP = 1.5, MIN_FILL = 30;
    let y = M, drawn = 0;
    const isHead = el => !!el.closest(".lh1,.lh2") || el.tagName === "H3";
    const noSplit = el => el.matches(".pdf-banner,.bilingual-row,.limg,.grammar-card") || isHead(el);
    // يدوّر على سطر أبيض تمامًا قرب نقطة القص عشان ما يقطعش في نص سطر
    const rowBlank = (ctx, w, yy) => { const d = ctx.getImageData(14, yy, Math.max(1, w - 28), 1).data; for (let i = 0; i < d.length; i += 4) if (d[i] < 242 || d[i + 1] < 242 || d[i + 2] < 242) return false; return true; };
    const place = (el, cv, scale) => {
      if (!cv.width || !cv.height) return;
      const mm = W / 718 / scale, ctx = cv.getContext("2d"), fullH = cv.height * mm, nosplit = noSplit(el);
      const draw = (sy, sh) => {
        const w = Math.min(W, cv.width * mm), h = sh * mm;
        let data;
        if (sy === 0 && sh === cv.height) data = cv.toDataURL("image/jpeg", 0.9);
        else { const t = document.createElement("canvas"); t.width = cv.width; t.height = sh; t.getContext("2d").drawImage(cv, 0, sy, cv.width, sh, 0, 0, cv.width, sh); data = t.toDataURL("image/jpeg", 0.9); }
        pdf.addImage(data, "JPEG", M, y, w, h); y += h + GAP;
      };
      if (isHead(el) && y > M && (M + PH - y) < fullH + 25) { pdf.addPage(); y = M; }
      let sy = 0, guard = 0;
      while (sy < cv.height && guard++ < 300) {
        const remPx = Math.floor((M + PH - y) / mm), left = cv.height - sy;
        if (left <= remPx) { draw(sy, left); sy = cv.height; break; }
        if (y > M && (nosplit || remPx * mm < MIN_FILL)) { pdf.addPage(); y = M; continue; }
        let cut = remPx;
        if (!nosplit) for (let c = remPx; c > remPx * 0.6; c--) { if (rowBlank(ctx, cv.width, sy + c)) { cut = c; break; } }
        draw(sy, cut); sy += cut; pdf.addPage(); y = M;
      }
      drawn++;
    };

    // نصوّر مجموعات من الوحدات في لقطة واحدة (أسرع بكتير) ونقص كل وحدة منها
    const rr = rootEl.getBoundingClientRect();
    const geom = units.map(el => { const r = el.getBoundingClientRect(); return { el, top: r.top - rr.top, h: r.height }; });
    const BAND = 1800, SC = 2;
    const shot = (el, opts) => window.html2canvas(el, { backgroundColor: "#ffffff", useCORS: true, logging: false, windowWidth: 718, ...opts });
    let i = 0;
    while (i < geom.length) {
      btn.textContent = `⏳ ${Math.min(i + 1, geom.length)} / ${geom.length}`;
      const g0 = geom[i];
      if (g0.h < 2) { i++; continue; }
      if (g0.h > BAND) { const sc = g0.h > 5000 ? 1.2 : SC; place(g0.el, await shot(g0.el, { scale: sc }), sc); i++; continue; }
      let j = i;
      while (j + 1 < geom.length && geom[j + 1].h <= BAND && geom[j + 1].top + geom[j + 1].h - g0.top <= BAND) j++;
      const bandTop = Math.floor(g0.top), bandH = Math.ceil(geom[j].top + geom[j].h) - bandTop;
      const big = await shot(rootEl, { scale: SC, x: 0, y: bandTop, width: 718, height: bandH });
      const okBand = big.width >= 718 * SC - 4 && Math.abs(big.height - bandH * SC) <= 6;
      for (let k = i; k <= j; k++) {
        const g = geom[k]; if (g.h < 2) continue;
        let cv;
        if (okBand) {
          const sy = Math.max(0, Math.round((g.top - bandTop) * SC)), sh = Math.min(big.height - sy, Math.max(1, Math.round(g.h * SC)));
          cv = document.createElement("canvas"); cv.width = big.width; cv.height = sh;
          cv.getContext("2d").drawImage(big, 0, sy, big.width, sh, 0, 0, big.width, sh);
        } else cv = await shot(g.el, { scale: SC });
        place(g.el, cv, SC);
      }
      i = j + 1;
    }
    if (!drawn) throw new Error("لم يتم تجهيز أي محتوى للملف");
    const safeName = String(l.title || "lesson").replace(/[\\/:*?"<>|]+/g, " ").trim() || "lesson";
    pdf.save(safeName + ".pdf");
  } catch (e) {
    console.error(e);
    alert("تعذر تحميل الملف: " + (e.message || e.code || ""));
  } finally {
    if (frame) frame.remove();
    btn.disabled = false; btn.textContent = old;
  }
}

/* ---------- حل أسئلة الدرس بالذكاء الاصطناعي (للأدمن) ---------- */
async function aiSolveBlocks(blocks, progress) {
  const src = blocks.filter(b => b.t === "p" && String(b.v || "").trim()).map((b, k) => ({ id: k, b, text: String(b.v).trim() }));
  if (!src.length) return { solved: 0, failed: 0 };
  const chunks = []; let cur = [], len = 0;
  src.forEach(x => { if (cur.length && len + x.text.length > 12000) { chunks.push(cur); cur = []; len = 0; } cur.push(x); len += x.text.length; });
  if (cur.length) chunks.push(cur);
  const answers = new Map(); let failed = 0;
  for (let i = 0; i < chunks.length; i++) {
    if (progress) progress(`⏳ جاري الحل ${i + 1} من ${chunks.length}`);
    try {
      const prompt = `أنت أستاذ لغة فرنسية. فيما يلي فقرات من درس، كل فقرة لها رقم. حدّد الفقرات التي فيها أسئلة أو تمارين للطالب (املأ الفراغ، اختر الإجابة، صحح، ترجم، أجب عن السؤال...) وحلّها حلًا صحيحًا. تجاهل الفقرات الشرحية التي ليس فيها أسئلة. لكل فقرة فيها أسئلة اكتب إجابة كل سؤال في سطر منفصل بنفس ترقيم السؤال وبنفس لغة السؤال، وأضف شرحًا مختصرًا جدًا بالعربية المبسطة بين قوسين عند الحاجة. لا تخترع أسئلة غير موجودة في النص ولا تعدّل نص السؤال. أعد JSON فقط بالشكل {"solutions":[{"id":رقم_الفقرة,"answer":"الحل"}]}، وأعد قائمة فارغة إذا لم توجد أسئلة.\n\n` + chunks[i].map(x => `[فقرة ${x.id}]\n${x.text}`).join("\n\n");
      const j = await askJSON(prompt, 2), sols = Array.isArray(j) ? j : (j.solutions || []);
      sols.forEach(x => { const a = String(x?.answer || "").trim(); if (a && Number.isInteger(Number(x.id))) answers.set(Number(x.id), a); });
    } catch (ex) { failed++; console.warn("solve chunk failed", ex); }
  }
  if (!answers.size) return { solved: 0, failed };
  for (let k = blocks.length - 1; k >= 0; k--) if (blocks[k].t === "ans") blocks.splice(k, 1);
  src.forEach(x => { const a = answers.get(x.id); if (!a) return; const idx = blocks.indexOf(x.b); if (idx >= 0) blocks.splice(idx + 1, 0, { t: "ans", v: a }); });
  return { solved: answers.size, failed };
}


const smClean = (v, n = 160) => String(v ?? "").replace(/\s+/g, " ").trim().slice(0, n);
const smBi = x => (typeof x === "string") ? { fr: smClean(x), ar: "" } : { fr: smClean(x?.fr), ar: smClean(x?.ar) };
async function generateLessonSummary(l, setStatus) {
  if (!editor) throw new Error("لا تملك صلاحية عمل ملخص للدرس");
  const blocks = (l.blocks && l.blocks.length) ? l.blocks : [{ t: "p", v: l.text || "" }];
  const text = blocks.filter(b => ["p", "h1", "h2"].includes(b.t)).map(b => String(b.v || "").trim()).filter(Boolean).join("\n").slice(0, 14000);
  if (text.length < 80) throw new Error("نص الدرس قصير جدًا للتلخيص");
  setStatus("🧠 الذكاء الاصطناعي بيقرا الدرس ويلخصه...");
  const j = await askJSON(`أنت أستاذ لغة فرنسية. اقرا نص الدرس ده واعمل للطلاب ملخصًا من جزأين. أعد JSON فقط بالشكل {"points":[{"fr":"...","ar":"..."}],"map":{"center":{"fr":"...","ar":"..."},"branches":[{"title":{"fr":"...","ar":"..."},"items":[{"fr":"...","ar":"..."}]}]}}. points: من 5 إلى 8 نقاط رئيسية قصيرة وواضحة، fr بفرنسية بسيطة وar ترجمتها بالعربية. map: خريطة أفكار للدرس: center هو موضوع الدرس، ومن 3 إلى 6 فروع، وكل فرع فيه من 2 إلى 4 عناصر قصيرة جدًا (كلمة أو عبارة قصيرة). اعتمد على نص الدرس فقط ولا تخترع معلومات غير موجودة فيه. نص الدرس:\n${text}`, 2);
  const points = (Array.isArray(j.points) ? j.points : []).map(smBi).filter(x => x.fr || x.ar).slice(0, 10);
  const m = j.map || {};
  const branches = (Array.isArray(m.branches) ? m.branches : []).map(b => ({ title: smBi(b?.title), items: (Array.isArray(b?.items) ? b.items : []).map(x => smBi(x)).filter(x => x.fr || x.ar).slice(0, 5) })).filter(b => (b.title.fr || b.title.ar) && b.items.length).slice(0, 7);
  if (!points.length && !branches.length) throw new Error("رد غير صالح من الذكاء الاصطناعي");
  const data = { summaryPoints: points.length ? points : deleteField(), summaryMap: branches.length ? { center: smBi(m.center), branches } : deleteField(), summaryAt: Date.now() };
  await setDoc(doc(db, "lessonContent", l.id), data, { merge: true });
  l.summaryPoints = points.length ? points : null; l.summaryMap = branches.length ? { center: smBi(m.center), branches } : null;
  setStatus("✅ تم عمل الملخص");
}
function renderLessonSummary(l) {
  const box = document.querySelector("#lessonSummary"); if (!box) return;

    ${editor && !pts && !mp ? `<p class="mut">لسه مفيش ملخص للدرس ده. اضغط الزرار وهيطلع نقاط رئيسية وخريطة أفكار.</p>` : ""}
    ${pts ? `<div class="lsum-part"><div class="row" style="align-items:center"><h4 style="margin:0;flex:1">⭐ النقاط الرئيسية</h4>${editor ? `<button type="button" class="del important-print-hide" id="sumDelPts">🗑 احذف النقاط</button>` : ""}</div><ol class="sm-list">${pts.map(x => `<li>${bi(x)}</li>`).join("")}</ol></div>` : ""}
    ${mp ? `<div class="lsum-part"><div class="row" style="align-items:center"><h4 style="margin:0;flex:1">🧠 خريطة أفكار الدرس</h4>${editor ? `<button type="button" class="del important-print-hide" id="sumDelMap">🗑 احذف الخريطة</button>` : ""}</div><div class="mm"><div class="mm-c">${bi(mp.center || {}, "")}</div><div class="mm-br">${mp.branches.map(b => `<div class="mm-b"><div class="mm-bt">${bi(b.title)}</div><ul>${b.items.map(x => `<li>${bi(x)}</li>`).join("")}</ul></div>`).join("")}</div></div></div>` : ""}</section>`;
  const st = box.querySelector("#sumStatus");
  const mk = box.querySelector("#sumMake");
  if (mk) mk.onclick = async () => {
    if ((pts || mp) && !confirm("هيتم عمل ملخص جديد وتبديل الملخص الحالي. تكمل؟")) return;

  };
  const delPart = async (field, key, msg) => {
    if (!confirm(msg)) return;
    try { await updateDoc(doc(db, "lessonContent", l.id), { [field]: deleteField() }); l[key] = null; renderLessonSummary(l); }
    catch (e) { alert("تعذر الحذف: " + (e.code || e.message || "خطأ")); }
  };
  const d1 = box.querySelector("#sumDelPts"); if (d1) d1.onclick = () => delPart("summaryPoints", "summaryPoints", "تحذف النقاط الرئيسية؟");
  const d2 = box.querySelector("#sumDelMap"); if (d2) d2.onclick = () => delPart("summaryMap", "summaryMap", "تحذف خريطة الأفكار؟");
}

/* ===== اختبر نطقك: قراءة النص كلمة بكلمة مع إيقاف عند أول غلطة ===== */
const pronNorm = w => String(w || "").toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
function pronTokens(text) {
  return String(text || "").replace(/\s+/g, " ").trim().split(" ").filter(Boolean).slice(0, 4000).map(raw => { const norm = pronNorm(raw); return { raw, norm, skip: !norm || /\d/.test(norm) }; });
}
function pronLev(a, b) {

  const um = new Map(D.users.map(u => [u.id, u])), by = new Map();
  const row = uid => { if (!by.has(uid)) by.set(uid, { uid, user: um.get(uid) || {}, per: new Map() }); return by.get(uid); };
  const cell = (r, id) => { if (!r.per.has(id)) r.per.set(id, { best: null, tries: 0, passed: false, completed: false }); return r.per.get(id); };
  const best = (c, p) => { c.best = c.best === null ? p : Math.max(c.best, p); };
  D.attempts.forEach(a => { if (!lid.has(a.lessonId)) return; const c = cell(row(a.uid), a.lessonId); c.tries++; best(c, Number(a.percent) || 0); });
  D.passes.forEach(a => { if (!lid.has(a.lessonId)) return; const c = cell(row(a.uid), a.lessonId); c.passed = true; best(c, Number(a.percent) || 0); });
  D.progress.forEach(a => { if (!a.completed || !lid.has(a.lessonId)) return; cell(row(a.uid), a.lessonId).completed = true; });
  const students = [...by.values()].map(r => {
    const cells = [...r.per.values()], scored = cells.filter(c => c.best !== null);
    return { ...r, solved: scored.length, passed: cells.filter(c => c.passed).length, avg: scored.length ? Math.round(scored.reduce((a, c) => a + c.best, 0) / scored.length) : null };

  const scoredStudents = students.filter(x => x.avg !== null);

}

function lessonGradeStats(D, lesson) {

async function dmStartCall(th, type) {

  if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) return alert("المتصفح لا يدعم المكالمات. افتح الموقع عبر HTTPS وبمتصفح حديث.");

  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === "video" }); }
  catch (e) { return alert("تعذر فتح المايك/الكاميرا: " + (e.name || e.message)); }
  const callId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), ref = doc(db, "dmCalls", th.id);
  const c = dmCall = { role: "admin", id: callId, uid: th.id, type, ref, stream, unsubs: [], peer: th.name || "الطالب", remote: new MediaStream() };
  try {
    const old = await getDocs(collection(db, "dmCalls", th.id, "cands"));
    if (old.size) { const b = writeBatch(db); old.docs.slice(0, 400).forEach(x => b.delete(x.ref)); await b.commit(); }

}

function gpxChapters(blocks) {
  const textOf = b => (b.t === "h1" || b.t === "h2" || b.t === "p") ? String(b.v || "") : "";
  const topH2 = b => b.t === "h2" && /^(conclusion générale|conclusion|annexes?|bibliographie|références|résumé|abstract|الخاتمة|المراجع)\s*[:.]?\s*$/i.test(String(b.v || "").trim());
  const isTop = b => b.t === "h1" || topH2(b);
  let pick = isTop;
  if (blocks.filter(isTop).length < 2 && blocks.filter(b => b.t === "h2").length >= 2) pick = b => b.t === "h1" || b.t === "h2";
  let list = [];
  blocks.forEach((b, i) => {
    if (pick(b)) {
      const last = list[list.length - 1];
      if (last && !last.hasBody && last.lastHead === i - 1 && b.t === last.headType) { last.title += " " + String(b.v || "").trim(); last.lastHead = i; return; }
      list.push({ title: String(b.v || "").trim(), from: i, headType: b.t, hasBody: false, lastHead: i });
    } else if (list.length) list[list.length - 1].hasBody = true;
  });
  if (list.length) list[0].from = 0;
  list.forEach((c, i) => { c.to = i + 1 < list.length ? list[i + 1].from : blocks.length; });
  const stat = c => { let chars = 0, imgs = 0; const secs = []; for (let i = c.from; i < c.to; i++) { const b = blocks[i]; chars += textOf(b).length; if (b.t === "img") imgs++; if (b.t === "h2" && i > c.from) secs.push(b.v); } c.chars = chars; c.imgs = imgs; c.secs = secs; };
  list.forEach(stat);
  for (let i = list.length - 1; i > 0; i--) if (list[i].chars < 450 && list[i].imgs === 0) { list[i - 1].to = list[i].to; list.splice(i, 1); stat(list[i - 1]); }
  if (list.length <= 1) {
    const total = blocks.reduce((n, b) => n + textOf(b).length, 0);
    if (total > 9000) {
      list = []; let start = 0, chars = 0;
      blocks.forEach((b, i) => { chars += textOf(b).length; const next = blocks[i + 1]; if (chars >= 6000 && next && (next.t === "h1" || next.t === "h2" || next.t === "p")) { list.push({ from: start, to: i + 1 }); start = i + 1; chars = 0; } });
      if (start < blocks.length) list.push({ from: start, to: blocks.length });
      list.forEach((c, i) => { const h = blocks.slice(c.from, c.to).find(b => b.t === "h1" || b.t === "h2"); c.title = `الجزء ${i + 1}${h ? " — " + h.v : ""}`; stat(c); });
    } else { list = [{ title: (blocks.find(b => b.t === "h1" || b.t === "h2")?.v) || "المشروع", from: 0, to: blocks.length }]; stat(list[0]); }
  }
  list.forEach((c, i) => { c.idx = i; });
  return list;
}

function midChunk(blocks, imgs) {
  const chunks = []; let cur = { blocks: [], imgs: {} }, size = 0, total = 0;
  for (const b0 of blocks) {
    const b = gpxEncode(b0), sz = gpxBytes(JSON.stringify(b)) + (b.t === "img" ? (imgs[b.v] || "").length : 0) + 30; total += sz;
    if (cur.blocks.length && size + sz > GPX_CHUNK_BYTES) { chunks.push(cur); cur = { blocks: [], imgs: {} }; size = 0; }
    cur.blocks.push(b); if (b.t === "img" && imgs[b.v]) cur.imgs[b.v] = imgs[b.v]; size += sz;
  }
  if (cur.blocks.length) chunks.push(cur);
  return { chunks, total };
}
async function midSaveContent(sid, lid, blocks, imgs) {
  const { chunks, total } = midChunk(blocks, imgs);
  if (total > GPX_MAX_TOTAL) throw new Error("حجم الدرس كبير جدًا بعد الضغط");
  const col = collection(db, "midterms", sid, "content");
  for (let k = 0; k < chunks.length; k++) await setDoc(doc(col, `${lid}_${String(k).padStart(3, "0")}`), { lid, k, blocks: chunks[k].blocks, imgs: chunks[k].imgs });
  const old = await getDocs(query(col, where("lid", "==", lid)));
  for (const d of old.docs) if (d.data().k >= chunks.length) await deleteDoc(d.ref);
  return chunks.length;
}
async function midLoadLesson(sid, lid) {
  const s = await getDocs(query(collection(db, "midterms", sid, "content"), where("lid", "==", lid)));
  const blocks = [], imgs = {};
  s.docs.map(d => d.data()).sort((a, b) => a.k - b.k).forEach(d => { blocks.push(...(d.blocks || []).map(gpxDecode)); Object.assign(imgs, d.imgs || {}); });
  return { blocks, imgs };
}
async function midLessons(sid) {

      const gr = Array.isArray(j) ? j : j?.grades;

function compareFrenchTranscriptToScript(transcript,script){

function splitGraduationText(src,parts){
  const n=src.length;if(parts<2||n<parts)return [src];
  const size=n/parts,win=Math.floor(size*0.2),minPart=Math.floor(size*0.4);
  const head=/^\s*(?:chapitre|partie|section|introduction|conclusion|résumé|resume|bibliographie|annexes?|remerciements|الفصل|الباب|المبحث|المقدمة|الخاتمة|\d{1,2}(?:\.\d+)*[.)\s-]|[IVX]+[.)\s-])/i;
  const cuts=[];let prev=0;
  for(let i=1;i<parts;i++){
    const target=Math.round(size*i);
    let lo=Math.max(prev+minPart,target-win),hi=Math.min(n-minPart*(parts-i),target+win);
    if(hi<lo){lo=hi=Math.min(Math.max(prev+1,target),n-1);}
    let best=-1,bestScore=99,bestDist=1e12;
    for(let p=lo;p<=hi;p++){
      const a=src[p-1];if(a===undefined)continue;
      let sc=99;
      if(a==="\n"){sc=head.test(src.slice(p,p+80))?0:(src[p-2]==="\n"?1:2);}
      else if(/\s/.test(a)){sc=/[.!?…؟]/.test(src[p-2]||"")?3:4;}
      if(sc===99)continue;
      const dist=Math.abs(p-target);
      if(sc<bestScore||(sc===bestScore&&dist<bestDist)){best=p;bestScore=sc;bestDist=dist;}
    }

  }

  return out;

  const out=[];
  String(text||"").split(/\n\s*\n+/).map(x=>x.replace(/\s*\n\s*/g," ").trim()).filter(Boolean).forEach(par=>{
    if(par.length<=800){out.push(par);return;}

async function ytInfo(id) {
  try {
    const r = await fetch("https://www.youtube.com/oembed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id) + "&format=json");
    if (r.ok) { const j = await r.json(); return { title: j.title || "", channel: j.author_name || "", verified: true }; }

async function findGrammarVideo(g, level) {
  const prompt = `ابحث في الإنترنت عن أفضل فيديو يوتيوب يشرح درس القواعد الفرنسي التالي لمستوى ${level} (CEFR): "${g[0]}" (${g[1]}). الأفضل فيديو بشرح عربي واضح، وإن لم يوجد فبالفرنسية البسيطة للمبتدئين، ومدته بين 3 و20 دقيقة، من قناة تعليمية معروفة. اكتب 3 روابط كاملة فقط بصيغة https://www.youtube.com/watch?v=XXXXXXXXXXX، كل رابط في سطر مع عنوان الفيديو. لا تخترع روابط.`;
  let txt = "";
  for (let k = 0; k < 3; k++) { try { txt = (await searchModel.generateContent(prompt)).response.text(); break; } catch (e) { if (k === 2 || !/429|quota|exceeded/i.test(String(e.message || e))) throw e; await new Promise(r => setTimeout(r, 8000 * (k + 1))); } }
  const ids = [...new Set([...txt.matchAll(/(?:v=|youtu\.be\/)([\w-]{11})/g)].map(m => m[1]))];
  for (const id of ids.slice(0, 4)) { const info = await ytInfo(id); if (info) return { id, ...info }; }
  throw new Error("لم أجد فيديو صالح للتضمين");
}

async function generateGrammar(g, level) {
  const prompt = `أنت أستاذ لغة فرنسية لطلاب مصريين مبتدئين. اكتب درس قواعد مبسط ومنظم لمستوى ${level} (CEFR) عن: "${g[0]}" (${g[1]}).
الشرح بالعامية المصرية البسيطة، والأمثلة بالفرنسية مع ترجمتها للعربية.
قسّم الدرس بالترتيب إلى أقسام، كل قسم عنوان فرعي (t:"h2") يليه فقرة (t:"p"):
1) "إيه هو الدرس ده؟" مقدمة قصيرة في جملتين.
2) "القاعدة" الشرح خطوة خطوة، واستخدم أسطرًا تبدأ بـ "- " للنقاط، وجداول التصريف كنقاط (مثال: - je suis = أنا).
3) "أمثلة" من 6 إلى 8 جمل فرنسية بسيطة، كل جملة في سطر يبدأ بـ "- " ثم الجملة ثم " = " ثم الترجمة العربية.
4) "أخطاء شائعة" من 2 إلى 3 أخطاء يقع فيها المصريون مع الصحيح.
5) "نصيحة للحفظ" جملة أو جملتان.
ثم ضع 8 أسئلة عن الدرس نفسه: 6 اختيار من متعدد (type "mcq" و4 اختيارات و"answer" رقم الصحيح ويبدأ من 0) و2 صح/غلط (type "tf" و"options" فارغة و"answer" 0 للعبارة الصحيحة و1 للخاطئة). الأسئلة بالفرنسية البسيطة، ولكل سؤال "explanation" بالعربية المبسطة في جملتين تشرح الإجابة الصحيحة. لا تكرر الأسئلة. تأكد أن كل الأمثلة والإجابات الصحيحة سليمة لغويًا.
أعد JSON فقط: {"blocks":[{"t":"h2","v":"..."},{"t":"p","v":"..."}],"questions":[{"type":"mcq","q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}]}`;
  const j = await askJSON(prompt, 3);
  const blocks = (j.blocks || []).map(b => ({ t: b.t === "h2" ? "h2" : "p", v: String(b.v ?? b.text ?? "").trim() })).filter(b => b.v);
  const questions = [];
  for (const x of (j.questions || [])) {
    const q = String(x.q || x.question || "").trim(); if (!q) continue;
    const explanation = String(x.explanation || "").trim(), a = Number(x.answer);
    if (!Number.isInteger(a)) continue;
    if (/tf|true|false|صح/i.test(String(x.type || ""))) { if (a < 0 || a > 1) continue; questions.push({ type: "tf", q, options: ["صح", "غلط"], answer: a, explanation }); }
    else { const options = (x.options || []).map(o => String(o).trim()).filter(Boolean); if (options.length < 2 || a < 0 || a >= options.length) continue; questions.push({ type: "mcq", q, options, answer: a, explanation }); }
  }
  if (blocks.length < 3 || questions.length < 3) throw new Error("رد الذكاء الاصطناعي ناقص، جرّب تاني");
  return { blocks, questions };
}
function renderGrText(el, blocks) {
  el.textContent = "";
  const bold = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  let sec = null;
  blocks.forEach(b => {
    if (b.t === "h2" || !sec) { sec = document.createElement("section"); sec.className = "lsec"; el.appendChild(sec); }
    if (b.t === "h2") { const h = document.createElement("h4"); h.className = "lh2"; h.dir = "auto"; h.textContent = b.v; sec.appendChild(h); return; }
    let ul = null, buf = [];
    const flush = () => { if (buf.length) { const d = document.createElement("div"); d.className = "lp"; d.dir = "auto"; d.innerHTML = bold(buf.join("\n")); sec.appendChild(d); buf = []; } };
    for (const line of String(b.v).split("\n")) {
      const m = line.match(/^\s*[-•*]\s+(.*)$/);
      if (m) { flush(); if (!ul) { ul = document.createElement("ul"); ul.className = "ll"; sec.appendChild(ul); } const li = document.createElement("li"); li.dir = "auto"; li.innerHTML = bold(m[1]); ul.appendChild(li); }
      else if (!line.trim()) { flush(); ul = null; }
      else { ul = null; buf.push(line); }
    }
    flush();
  });
}
function grQuiz(box, questions) {
  const sh = a => [...a].sort(() => Math.random() - .5);
  const qs = sh(questions).map(q => { if (q.type !== "mcq") return q; const o = sh(q.options.map((t, i) => ({ t, i }))); return { ...q, options: o.map(x => x.t), answer: o.findIndex(x => x.i === q.answer) }; });
  let done = 0, score = 0;
  box.innerHTML = qs.map((q, i) => `<div class="q" data-i="${i}"><div class="fr"><b>${i + 1}.</b> ${esc(q.q)}</div>${q.options.map((o, j) => `<button class="opt ${q.type === "mcq" ? "fr" : ""}" data-j="${j}">${esc(o)}</button>`).join("")}</div>`).join("") + `<div id="grRes"></div>`;
  box.onclick = e => {
    const t = e.target.closest(".opt"); if (!t) return;
    const qEl = t.closest(".q"); if (qEl.dataset.done) return; qEl.dataset.done = 1;
    const q = qs[+qEl.dataset.i], ok = +t.dataset.j === q.answer;
    qEl.querySelectorAll(".opt")[q.answer].classList.add("right"); if (!ok) t.classList.add("wrong");
    const fb = document.createElement("div"); fb.className = "fb " + (ok ? "ok" : "bad"); fb.dir = "auto";
    fb.innerHTML = (ok ? "✅ إجابة صحيحة" : "❌ إجابة غلط — الصح: <b>" + esc(q.options[q.answer]) + "</b>") + (q.explanation ? `<div class="fbx">${esc(q.explanation)}</div>` : "");
    qEl.appendChild(fb);
    done++; if (ok) score++;
    if (done === qs.length) {
      const res = box.querySelector("#grRes");
      res.innerHTML = `<div class="q"><b>نتيجتك:</b> <span class="score">${score}/${qs.length}</span> — ${Math.round(score / qs.length * 100)}%<div class="row"><button id="grRetry">🔁 أعد الأسئلة</button></div></div>`;
      res.scrollIntoView({ block: "nearest" }); box.querySelector("#grRetry").onclick = () => grQuiz(box, questions);
    }
  };
}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قسم الفرنسي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14264f;--navy2:#0d1a38;--gold:#c19a4b;--bg:#f1f3f6;--line:#dde2ea;--red:#b3261e;--ok:#177a45;--mut:#5d6882}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1b2438;font-family:Cairo,system-ui,sans-serif;line-height:1.7}
.top{background:var(--navy2);color:#cfd6e6;font-size:.85rem;padding:5px 16px;text-align:center}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--gold);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;cursor:pointer;flex:1;min-width:230px}
.brand svg{width:40px;height:48px}
.brand b{display:block;font:600 1.25rem/1.2 Fraunces,Georgia,serif;color:var(--navy);direction:ltr}
.brand small{color:var(--mut)}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav a{cursor:pointer;padding:6px 12px;border-radius:6px;color:var(--navy);font-weight:600}
nav a:hover{background:var(--bg)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 140px}
button{font:inherit;border:0;border-radius:8px;padding:7px 18px;background:var(--navy);color:#fff;cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
button.sec{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
button.del{background:var(--red)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
h2,h3{margin:0}
.fr{font-family:Fraunces,Georgia,serif;direction:ltr;text-align:left}
.mut{color:var(--mut)}
.hero{border-radius:14px;color:#fff;padding:70px 28px 44px;margin-bottom:34px;background:linear-gradient(90deg,rgba(13,26,56,.93),rgba(13,26,56,.55)),var(--navy2)}
.hero p{margin:0;color:#e8d9b5}
.hero h2{font-size:clamp(2.2rem,7vw,3.8rem);font-weight:600;line-height:1.1;margin:10px 0 20px;max-width:14ch}
.hero h2::after{content:"";display:block;width:80px;height:4px;background:var(--gold);margin-top:14px}
.hero .w:hover{background:var(--gold);color:var(--navy2)}
.hero button{background:var(--gold);color:var(--navy2)}
.hero .sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.sh{font-size:1.4rem;font-weight:800;color:var(--navy);margin:6px 0 16px;border-inline-start:5px solid var(--gold);padding-inline-start:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.item{cursor:pointer}
.tile{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,38,79,.15);transition:box-shadow .2s}
.tile:hover{box-shadow:0 10px 26px rgba(20,38,79,.22)}
.cv{height:140px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#2f5096) center/cover}
.cv em{font:italic 600 4.5rem Fraunces,serif;color:rgba(193,154,75,.85)}
.cv[style*="url"] em{display:none}
.tb{padding:12px 16px;border-top:3px solid var(--gold);font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item:not(.tile){display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;border-inline-start:5px solid var(--gold);padding:14px 18px;margin:10px 0;font-size:1.1rem;font-weight:600;box-shadow:0 1px 3px rgba(20,38,79,.1)}
.item:not(.tile):hover{box-shadow:0 6px 18px rgba(20,38,79,.2)}
.item span{flex:1}
.lesson-stars{display:inline-flex;gap:1px;color:var(--gold);font-size:1.05rem;letter-spacing:1px;white-space:nowrap;text-shadow:0 0 12px rgba(255,209,102,.35)}
.lesson-stars .empty{color:rgba(255,255,255,.22);text-shadow:none}
.n{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:Fraunces,serif}
.text{background:#fff;border-radius:12px;padding:28px;font-size:1.4rem;line-height:2;white-space:pre-wrap;box-shadow:0 1px 3px rgba(20,38,79,.12)}
.tts-sentence{border-radius:7px;transition:background .2s ease,box-shadow .2s ease;color:inherit}
.tts-sentence.reading{background:rgba(255,209,102,.28);box-shadow:0 0 0 3px rgba(255,209,102,.12);color:inherit!important;text-shadow:none}
.w{cursor:pointer;border-radius:4px}.w:hover{background:#f3e3b8}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:12px 0}
.q{background:#fff;border-radius:12px;padding:20px;margin:14px 0;font-size:1.1rem;box-shadow:0 1px 3px rgba(20,38,79,.12)}
.essay{min-height:130px}.score{display:inline-block;padding:3px 10px;border-radius:999px;background:#e8f5ee;color:var(--ok);font-weight:800}.danger{color:var(--red)}
.q>.fr b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:.9rem;margin-inline-end:8px}
.opt{display:block;width:100%;text-align:start;background:var(--bg);color:#1b2438;border-radius:8px;margin:8px 0;padding:10px 16px}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--red);color:#fff}
dialog{border:0;border-radius:14px;width:min(92vw,480px);padding:22px}
dialog::backdrop{background:rgba(13,26,56,.6)}
label{display:block;margin:10px 0;font-weight:600}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:8px;margin-top:3px;background:#fff}
footer{background:var(--navy2);color:#aab4cc;text-align:center;padding:22px 16px;border-top:3px solid var(--gold)}
#sheet{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,460px);background:var(--navy);color:#fff;border-radius:14px;border-top:4px solid var(--gold);padding:18px;text-align:center;box-shadow:0 12px 40px rgba(13,26,56,.5);display:none;z-index:50}
#sheet .f{font-size:1.8rem}
#sheet .a{font-size:1.5rem;color:var(--gold);margin:2px 0 10px;min-height:2.4rem}
#sheet .b{color:#cfd6e6;font-size:.95rem;margin-bottom:8px;min-height:1.4rem}
#sheet button{background:var(--gold);color:var(--navy2)}
#sheet .sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

async function googleLogin(){ const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"}); const btn=$("#auth"), old=btn.textContent; btn.disabled=true; btn.textContent="جاري فتح Google..."; let warned=false; const timer=setTimeout(()=>{warned=true; btn.disabled=false; btn.textContent=old; alert("لم تفتح نافذة Google. اسمح بالنوافذ المنبثقة لهذا الموقع، ثم اضغط دخول بجوجل مرة أخرى.");},8000); try{ await signInWithPopup(auth,provider); }catch(e){ clearTimeout(timer); btn.disabled=false; btn.textContent=old; if(e.code==="auth/popup-blocked") alert("المتصفح منع نافذة Google. اسمح بالنوافذ المنبثقة لهذا الموقع."); else if(e.code!=="auth/popup-closed-by-user") alert(`تعذر تسجيل الدخول بجوجل: ${e.code||"تأكد من تفعيل Google في Firebase"}`); } }

let netWarnTimer = null;
function netWarn() {
  let b = document.querySelector("#netWarn");
  if (!b) { b = document.createElement("div"); b.id = "netWarn"; b.textContent = "⚠ تعذر تحميل بعض البيانات. اتأكد من النت وحاول تاني."; b.style.cssText = "position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#b3261e;color:#fff;padding:10px 18px;border-radius:10px;z-index:100;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)"; document.body.appendChild(b); }
  clearTimeout(netWarnTimer); netWarnTimer = setTimeout(() => b.remove(), 6000);
}
const list = async (col, field, val) => {
  const q = field ? query(collection(db, col), where(field, "==", val)) : collection(db, col);
  try { return (await withTimeout(getDocs(q))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.created?.seconds || 0) - (b.created?.seconds || 0)); }
  catch(e){ console.warn(`تعذر تحميل ${col}:`,e.message); if (e.code !== "permission-denied") netWarn(); return []; }
};
const listArrayContains = async (col, field, val) => {
  const q=query(collection(db,col),where(field,"array-contains",val));
  try { return (await withTimeout(getDocs(q))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.created?.seconds||0)-(b.created?.seconds||0)); }
  catch(e){ console.warn(`تعذر تحميل ${col}:`,e.message); if(e.code!=="permission-denied")netWarn(); return []; }
};
function normalizeSearchText(value){return String(value??"").normalize("NFD").replace(/[\u0300-\u036f\u064b-\u065f\u0670]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").toLocaleLowerCase("ar").trim();}
async function groupStudents() {
  const current=await list("groupDirectory"), merged=new Map();
  if(groupAdmin) (await list("studentDirectory")).forEach(x=>merged.set(x.id,x));
  current.forEach(x=>merged.set(x.id,{...merged.get(x.id),...x}));
  return [...merged.values()].filter(x=>x.name&&!x.disabled).map(x=>({id:x.id,name:x.name,disabled:x.disabled===true}));
}
function form(title, fields, cb) {
  const d = document.createElement("dialog");
  const fieldMarkup=fields.map(f=>{
    if(f.t==="chkSearch")return `<div class="form-search-checkbox-field"><span class="form-field-label">${esc(f.l)}</span><input type="search" data-member-search placeholder="اكتب بداية الاسم بالعربي أو الإنجليزي..." aria-label="ابحث عن عضو بالاسم"><div class="member-search-list" style="max-height:240px;overflow:auto">${f.o.map(o=>`<label class="member-search-option" data-search-prefix="${esc(normalizeSearchText(o[1]))}"><input type="checkbox" name="${esc(f.n)}" value="${esc(o[0])}" style="width:auto"> <span>${esc(o[1])}</span></label>`).join("")}</div></div>`;
    let control="";
    if(f.t==="area")control=`<textarea name="${esc(f.n)}" rows="6"></textarea>`;
    else if(f.t==="file")control=`<input name="${esc(f.n)}" type="file" accept="${esc(f.accept||"application/pdf,.pdf")}">`;
    else if(f.t==="chk")control=`<div style="max-height:200px;overflow:auto">${f.o.map(o=>`<div><input type="checkbox" name="${esc(f.n)}" value="${esc(o[0])}" style="width:auto"> ${esc(o[1])}</div>`).join("")}</div>`;
    else if(f.t==="sel")control=`<select name="${esc(f.n)}">${f.o.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`;
    else control=`<input name="${esc(f.n)}" type="${f.t==="number"?"number":"text"}" ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""} ${f.step!=null?`step="${f.step}"`:f.t==="number"?`step="1"`:""}>`;
    return `<label>${esc(f.l)}${control}</label>`;
  }).join("");
  d.innerHTML=`<form><h3>${esc(title)}</h3>${fieldMarkup}<div class="row"><button>حفظ</button><button type="button" class="sec">إلغاء</button></div></form>`;
  document.body.appendChild(d);
  fields.forEach(f=>{const el=d.querySelector(`[name="${f.n}"]`);if(el&&f.v!=null&&f.t!=="chk"&&f.t!=="chkSearch"&&f.t!=="file")el.value=f.v;});
  d.showModal();
  d.querySelectorAll("[data-member-search]").forEach(input=>{const options=[...d.querySelectorAll(".member-search-option")];input.addEventListener("input",()=>{const q=normalizeSearchText(input.value);options.forEach(option=>{option.hidden=!!q&&!option.dataset.searchPrefix.startsWith(q);});});});
  d.querySelector(".sec").onclick=()=>{d.close();d.remove();};

async function generateExam(l, c) {

  if (ttsIdx >= ttsQueue.length) { ttsState = "idle"; ttsIdx = 0; if (ttsBtn) ttsBtn.textContent = TTS_LABEL; document.querySelectorAll(".tts-sentence.reading").forEach(e => e.classList.remove("reading")); return; }
  const chunk = ttsQueue[ttsIdx];
  highlightSpeechChunk(chunk);
  const u = new SpeechSynthesisUtterance(chunk);
  u.lang = "fr-FR"; u.rate = 0.9;
  const v = frVoice(); if (v) u.voice = v;
  const vn = v ? `🔊 الصوت: ${v.name} ${v.localService ? "(محلي)" : "(أونلاين — ممكن يتأخر)"}` : "⚠ مفيش صوت فرنسي على المتصفح ده، هيتنطق بالصوت الافتراضي وممكن يطلع غلط";
  ttsNote(vn);
  const dog = setTimeout(() => { if (run === ttsRun) ttsNote("⏳ الصوت بيتأخر. غالبًا صوت المتصفح الفرنسي أونلاين أو مش متاح. جرّب Edge، أو نزّل صوت فرنسي من إعدادات الويندوز (Time & Language ← Speech)"); }, 3000);
  u.onstart = () => { clearTimeout(dog); ttsNote(vn); };
  u.onend = () => { clearTimeout(dog); if (run === ttsRun) { ttsIdx++; ttsPlay(run); } };
  u.onerror = e => { clearTimeout(dog); if (run !== ttsRun || (e && (e.error === "interrupted" || e.error === "canceled"))) return; ttsNote("⚠ تعذر تشغيل الصوت" + (e && e.error ? " (" + e.error + ")" : "")); ttsIdx++; ttsPlay(run); };
  speechSynthesis.speak(u);
}
function speakLesson(text, button) {
  if (!("speechSynthesis" in window)) return alert("النطق الصوتي غير مدعوم في هذا المتصفح");
  ttsBtn = button;
  if (ttsState === "playing") { ttsRun++; speechSynthesis.cancel(); ttsState = "paused"; button.textContent = "▶ استكمال الدرس"; return; }
  if (ttsState === "paused") { ttsState = "playing"; button.textContent = "⏸ إيقاف مؤقت"; ttsPlay(++ttsRun); return; }
  ttsQueue = ttsChunks(text); if (!ttsQueue.length) return;
  ttsIdx = 0; speechSynthesis.cancel(); ttsState = "playing"; button.textContent = "⏸ إيقاف مؤقت";
  const run = ++ttsRun;
  if (speechSynthesis.getVoices().length) setTimeout(() => ttsPlay(run), 80);
  else { let done = false; const go = () => { if (!done) { done = true; ttsPlay(run); } }; speechSynthesis.addEventListener("voiceschanged", go, { once: true }); setTimeout(go, 600); }
}

async function myGroups() {

    const [members,admins,created]=await Promise.all([listArrayContains("groups","members",user.uid),listArrayContains("groups","admins",user.uid),list("groups","createdBy",user.uid)]);
    groups=[...new Map([...members,...admins,...created].map(g=>[g.id,g])).values()];

}

  {n:"title",l:"اسم الجزء",v:task.title||""},
  {n:"description",l:"وصف الجزء",t:"area",v:task.description||""},
  {n:"content",l:"المحتوى أو النقاط الأساسية",t:"area",v:task.content||""},
  {n:"script",l:"النص الذي سيقوله الطالب بالفرنسية",t:"area",v:task.script||""},

  {n:"minutes",l:"وقت الكلام بالدقائق (1 إلى 8)",t:"number",min:1,max:8,v:String(Math.max(1,Math.min(8,Number(task.suggestedMinutes)||3)))},

];}

function compareFrenchTranscriptToScript(transcript,script){
  const tokens=value=>String(value||"").toLocaleLowerCase("fr-FR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ").replace(/œ/g,"oe").replace(/æ/g,"ae").match(/[a-z0-9]+/g)||[];
  const expected=tokens(script),heard=tokens(transcript);if(!expected.length)return {available:false,score:null,missing:[],matched:0,total:0};
  const dp=Array.from({length:expected.length+1},()=>new Uint16Array(heard.length+1));
  for(let i=1;i<=expected.length;i++)for(let j=1;j<=heard.length;j++)dp[i][j]=expected[i-1]===heard[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const matchedIndexes=new Set();let i=expected.length,j=heard.length;while(i>0&&j>0){if(expected[i-1]===heard[j-1]){matchedIndexes.add(i-1);i--;j--;}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;}
  const missing=expected.filter((_,index)=>!matchedIndexes.has(index));
  return {available:true,score:Math.round(dp[expected.length][heard.length]/expected.length*100),missing:[...new Set(missing)].slice(0,12),matched:dp[expected.length][heard.length],total:expected.length};
}

async function generateGrammar(g, level) {
  const prompt = `أنت أستاذ لغة فرنسية لطلاب مصريين مبتدئين. اكتب درس قواعد مبسط ومنظم لمستوى ${level} (CEFR) عن: "${g[0]}" (${g[1]}).
الشرح بالعامية المصرية البسيطة، والأمثلة بالفرنسية مع ترجمتها للعربية.
قسّم الدرس بالترتيب إلى أقسام، كل قسم عنوان فرعي (t:"h2") يليه فقرة (t:"p"):
1) "إيه هو الدرس ده؟" مقدمة قصيرة في جملتين.
2) "القاعدة" الشرح خطوة خطوة، واستخدم أسطرًا تبدأ بـ "- " للنقاط، وجداول التصريف كنقاط (مثال: - je suis = أنا).
3) "أمثلة" من 6 إلى 8 جمل فرنسية بسيطة، كل جملة في سطر يبدأ بـ "- " ثم الجملة ثم " = " ثم الترجمة العربية.
4) "أخطاء شائعة" من 2 إلى 3 أخطاء يقع فيها المصريون مع الصحيح.
5) "نصيحة للحفظ" جملة أو جملتان.
ثم ضع 8 أسئلة عن الدرس نفسه: 6 اختيار من متعدد (type "mcq" و4 اختيارات و"answer" رقم الصحيح ويبدأ من 0) و2 صح/غلط (type "tf" و"options" فارغة و"answer" 0 للعبارة الصحيحة و1 للخاطئة). الأسئلة بالفرنسية البسيطة، ولكل سؤال "explanation" بالعربية المبسطة في جملتين تشرح الإجابة الصحيحة. لا تكرر الأسئلة. تأكد أن كل الأمثلة والإجابات الصحيحة سليمة لغويًا.
أعد JSON فقط: {"blocks":[{"t":"h2","v":"..."},{"t":"p","v":"..."}],"questions":[{"type":"mcq","q":"...","options":["...","...","...","..."],"answer":0,"explanation":"..."}]}`;
  const j = await askJSON(prompt, 3);
  const blocks = (j.blocks || []).map(b => ({ t: b.t === "h2" ? "h2" : "p", v: String(b.v ?? b.text ?? "").trim() })).filter(b => b.v);
  const questions = [];
  for (const x of (j.questions || [])) {
    const q = String(x.q || x.question || "").trim(); if (!q) continue;
    const explanation = String(x.explanation || "").trim(), a = Number(x.answer);
    if (!Number.isInteger(a)) continue;
    if (/tf|true|false|صح/i.test(String(x.type || ""))) { if (a < 0 || a > 1) continue; questions.push({ type: "tf", q, options: ["صح", "غلط"], answer: a, explanation }); }
    else { const options = (x.options || []).map(o => String(o).trim()).filter(Boolean); if (options.length < 2 || a < 0 || a >= options.length) continue; questions.push({ type: "mcq", q, options, answer: a, explanation }); }
  }
  if (blocks.length < 3 || questions.length < 3) throw new Error("رد الذكاء الاصطناعي ناقص، جرّب تاني");
  return { blocks, questions };
}
function renderGrText(el, blocks) {
  el.textContent = "";
  const bold = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  blocks.forEach(b => {

    if (b.t === "h2") { const h = document.createElement("h4"); h.className = "lh2"; h.dir = "auto"; h.textContent = b.v; sec.appendChild(h); return; }
    let ul = null, buf = [];
    const flush = () => { if (buf.length) { const d = document.createElement("div"); d.className = "lp"; d.dir = "auto"; d.innerHTML = bold(buf.join("\n")); sec.appendChild(d); buf = []; } };
    for (const line of String(b.v).split("\n")) {
      const m = line.match(/^\s*[-•*]\s+(.*)$/);
      if (m) { flush(); if (!ul) { ul = document.createElement("ul"); ul.className = "ll"; sec.appendChild(ul); } const li = document.createElement("li"); li.dir = "auto"; li.innerHTML = bold(m[1]); ul.appendChild(li); }
      else if (!line.trim()) { flush(); ul = null; }
      else { ul = null; buf.push(line); }
    }
    flush();
  });
}
function grQuiz(box, questions) {
  const sh = a => [...a].sort(() => Math.random() - .5);
  const qs = sh(questions).map(q => { if (q.type !== "mcq") return q; const o = sh(q.options.map((t, i) => ({ t, i }))); return { ...q, options: o.map(x => x.t), answer: o.findIndex(x => x.i === q.answer) }; });
  let done = 0, score = 0;
  box.innerHTML = qs.map((q, i) => `<div class="q" data-i="${i}"><div class="fr"><b>${i + 1}.</b> ${esc(q.q)}</div>${q.options.map((o, j) => `<button class="opt ${q.type === "mcq" ? "fr" : ""}" data-j="${j}">${esc(o)}</button>`).join("")}</div>`).join("") + `<div id="grRes"></div>`;
  box.onclick = e => {
    const t = e.target.closest(".opt"); if (!t) return;
    const qEl = t.closest(".q"); if (qEl.dataset.done) return; qEl.dataset.done = 1;
    const q = qs[+qEl.dataset.i], ok = +t.dataset.j === q.answer;
    qEl.querySelectorAll(".opt")[q.answer].classList.add("right"); if (!ok) t.classList.add("wrong");
    const fb = document.createElement("div"); fb.className = "fb " + (ok ? "ok" : "bad"); fb.dir = "auto";
    fb.innerHTML = (ok ? "✅ إجابة صحيحة" : "❌ إجابة غلط — الصح: <b>" + esc(q.options[q.answer]) + "</b>") + (q.explanation ? `<div class="fbx">${esc(q.explanation)}</div>` : "");
    qEl.appendChild(fb);
    done++; if (ok) score++;
    if (done === qs.length) {
      const res = box.querySelector("#grRes");
      res.innerHTML = `<div class="q"><b>نتيجتك:</b> <span class="score">${score}/${qs.length}</span> — ${Math.round(score / qs.length * 100)}%<div class="row"><button id="grRetry">🔁 أعد الأسئلة</button></div></div>`;
      res.scrollIntoView({ block: "nearest" }); box.querySelector("#grRetry").onclick = () => grQuiz(box, questions);
    }
  };
}

    <div class="stepper" id="grSt">${steps.map((s, k) => `<button type="button" class="stp" data-k="${k}"><b>${k + 1}</b> ${s[0]} ${s[1]}</button>`).join("")}</div>
    <section class="pane" id="p_gv">
      ${v ? `<iframe id="grVid" src="about:blank" allowfullscreen></iframe><p class="mut">🎬 ${esc(v.title || "")}${v.channel ? " — " + esc(v.channel) : ""}${v.verified === false ? " ⚠ مش متحقق منه" : ""}</p>` : `<div class="q mut">لسه مفيش فيديو للدرس ده.</div>`}
      <div class="row"><button class="sec" id="grYt">🔎 ابحث في يوتيوب</button>${editor ? `<button class="sec" id="grFind">🤖 دوّر على أفضل شرح</button><button class="sec" id="grSet">✏ ضع رابط</button>${v ? `<button class="del" id="grDel">حذف الفيديو</button>` : ""}` : ""}<button type="button" id="grToLesson">التالي: الدرس ←</button></div>
    </section>
    <section class="pane" id="p_gl">
      ${c ? `<div class="row"><button class="sec" id="grAsk">🎓 اشرحلي أكتر بالذكاء الاصطناعي</button><span class="mut" style="flex:1">علّم بالقلم ✏️ على أي جزء مش فاهمه.</span></div><div class="text" id="grTxt"></div>` : `<div class="q mut">الدرس المكتوب لسه ماتعملش.</div><div class="row"><button id="grAsk">🎓 اشرحلي الدرس بالذكاء الاصطناعي</button></div>`}
      <div class="row">${hasQ ? `<button type="button" id="grToQuiz">التالي: الأسئلة ←</button>` : ""}</div>
    </section>
    <section class="pane" id="p_gq">${hasQ ? `<div id="grQz"></div>` : `<div class="q mut">مفيش أسئلة للدرس ده لسه.</div>`}</section>
    ${editor ? `<div class="row"><button class="sec" id="grGen">${c ? "🔄 أعد توليد الدرس والأسئلة" : "🤖 ولّد الدرس والأسئلة"}</button></div>` : ""}
    <div id="grMsg" class="mut"></div>
    <div class="row">${prev ? `<button class="sec" id="grPrev">→ السابق</button>` : ""}${next ? `<button id="grNext">التالي ←</button>` : ""}</div>`;
  const panes = ["p_gv", "p_gl", "p_gq"].map(id => $("#" + id)), btns = [...app.querySelectorAll("#grSt .stp")], vid = $("#grVid");
  const go = (n, quiet) => {
    panes.forEach((p, k) => p.classList.toggle("show", k === n)); btns.forEach((b, k) => b.classList.toggle("on", k === n));
    if (vid) vid.src = n === 0 ? `https://www.youtube.com/embed/${v.id}` : "about:blank";
    if (!quiet) $("#grSt").scrollIntoView({ block: "start", behavior: "smooth" });
  };
  btns.forEach((b, k) => b.onclick = () => go(k));
  if (c) renderGrText($("#grTxt"), c.blocks || []);
  if (hasQ) grQuiz($("#grQz"), c.questions);
  go(v ? 0 : 1, true);
  $("#grToLesson").onclick = () => go(1);
  if ($("#grToQuiz")) $("#grToQuiz").onclick = () => go(2);
  $("#grBack").onclick = () => { window.lessonCtx = null; grammarPage(level); };
  $("#grYt").onclick = () => window.open(yq, "_blank", "noopener");
  $("#grAsk").onclick = () => askAI(`اشرحلي درس القواعد الفرنسي "${g[0]}" (${g[1]}) لمستوى ${level} ببساطة شديدة: القاعدة، 5 أمثلة مترجمة، وأهم الأخطاء الشائعة.`);
  if ($("#grPrev")) $("#grPrev").onclick = () => grammarLesson(level, i - 1);
  if ($("#grNext")) $("#grNext").onclick = () => grammarLesson(level, i + 1);
  if (editor) {
    $("#grFind").onclick = async () => {
      const msg = $("#grMsg"); $("#grFind").disabled = true; msg.className = "mut"; msg.textContent = "🔎 الذكاء الاصطناعي بيدوّر على أفضل شرح...";
      try { await saveGrVideo(key, await findGrammarVideo(g, level)); grammarLesson(level, i); }
      catch (e) { console.warn(e); msg.className = "danger"; msg.textContent = "تعذر البحث: " + (e.message || e.code || "").slice(0, 160) + " — تقدر تحط الرابط بإيدك."; $("#grFind").disabled = false; }
    };
    $("#grSet").onclick = () => form("رابط فيديو الشرح", [{ n: "u", l: "رابط يوتيوب" }], async f => {
      const id = ytId(f.u); if (!id) return alert("الرابط مش صحيح");
      const info = await ytInfo(id);
      if (info === null && !confirm("الفيديو ده غالبًا مش متاح للتضمين. تحفظه برضه؟")) return;
      await saveGrVideo(key, { id, ...(info || {}) }); grammarLesson(level, i);
    });
    if (v) $("#grDel").onclick = async () => { if (confirm("حذف الفيديو؟")) { await deleteDoc(doc(db, "grammarVideos", key)); grammarLesson(level, i); } };
    $("#grGen").onclick = async () => {
      if (c && !confirm("الدرس والأسئلة الحاليين هيتمسحوا ويتعمل جديد. تكمل؟")) return;
      const msg = $("#grMsg"); $("#grGen").disabled = true; msg.className = "mut"; msg.textContent = "⏳ الذكاء الاصطناعي بيكتب الدرس والأسئلة... ممكن ياخد نص دقيقة";
      try { await saveGrContent(key, await generateGrammar(g, level)); grammarLesson(level, i); }
      catch (e) { console.warn(e); msg.className = "danger"; msg.textContent = "تعذر التوليد: " + (e.message || e.code || "").slice(0, 200); $("#grGen").disabled = false; }
    };
  }
}
$("#n10").onclick = () => grammarPage();
</script>
</body>
</html>

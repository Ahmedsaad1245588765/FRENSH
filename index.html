<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قسم الفرنسي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14264f;--navy2:#0d1a38;--gold:#c19a4b;--bg:#f1f3f6;--line:#dde2ea;--red:#b3261e;--ok:#177a45;--mut:#5d6882}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1b2438;font-family:Cairo,system-ui,sans-serif;line-height:1.7}
.top{background:var(--navy2);color:#cfd6e6;font-size:.85rem;padding:5px 16px;text-align:center}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--gold);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;cursor:pointer;flex:1;min-width:230px}
.brand svg{width:40px;height:48px}
.brand b{display:block;font:600 1.25rem/1.2 Fraunces,Georgia,serif;color:var(--navy);direction:ltr}
.brand small{color:var(--mut)}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav a{cursor:pointer;padding:6px 12px;border-radius:6px;color:var(--navy);font-weight:600}
nav a:hover{background:var(--bg)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 140px}
button{font:inherit;border:0;border-radius:8px;padding:7px 18px;background:var(--navy);color:#fff;cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
button.sec{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
button.del{background:var(--red)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
h2,h3{margin:0}
.fr{font-family:Fraunces,Georgia,serif;direction:ltr;text-align:left}
.mut{color:var(--mut)}
.hero{border-radius:14px;color:#fff;padding:70px 28px 44px;margin-bottom:34px;background:linear-gradient(90deg,rgba(13,26,56,.93),rgba(13,26,56,.55)),url(images/campus.jpg) center/cover,var(--navy2)}
.hero p{margin:0;color:#e8d9b5}
.hero h2{font-size:clamp(2.2rem,7vw,3.8rem);font-weight:600;line-height:1.1;margin:10px 0 20px;max-width:14ch}
.hero h2::after{content:"";display:block;width:80px;height:4px;background:var(--gold);margin-top:14px}
.hero .w:hover{background:var(--gold);color:var(--navy2)}
.hero button{background:var(--gold);color:var(--navy2)}
.hero .sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.sh{font-size:1.4rem;font-weight:800;color:var(--navy);margin:6px 0 16px;border-inline-start:5px solid var(--gold);padding-inline-start:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.item{cursor:pointer}
.tile{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,38,79,.15);transition:box-shadow .2s}
.tile:hover{box-shadow:0 10px 26px rgba(20,38,79,.22)}
.cv{height:140px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#2f5096) center/cover}
.cv em{font:italic 600 4.5rem Fraunces,serif;color:rgba(193,154,75,.85)}
.cv[style*="url"] em{display:none}
.tb{padding:12px 16px;border-top:3px solid var(--gold);font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item:not(.tile){display:flex;align-items:center;gap:14px;background:#fff;border-radius:10px;border-inline-start:5px solid var(--gold);padding:14px 18px;margin:10px 0;font-size:1.1rem;font-weight:600;box-shadow:0 1px 3px rgba(20,38,79,.1)}
.item:not(.tile):hover{box-shadow:0 6px 18px rgba(20,38,79,.2)}
.item span{flex:1}
.n{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:Fraunces,serif}
.text{background:#fff;border-radius:12px;padding:28px;font-size:1.4rem;line-height:2;white-space:pre-wrap;box-shadow:0 1px 3px rgba(20,38,79,.12)}
.w{cursor:pointer;border-radius:4px}.w:hover{background:#f3e3b8}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:12px 0}
.q{background:#fff;border-radius:12px;padding:20px;margin:14px 0;font-size:1.1rem;box-shadow:0 1px 3px rgba(20,38,79,.12)}
.essay{min-height:130px}.score{display:inline-block;padding:3px 10px;border-radius:999px;background:#e8f5ee;color:var(--ok);font-weight:800}.danger{color:var(--red)}
.q>.fr b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:.9rem;margin-inline-end:8px}
.opt{display:block;width:100%;text-align:start;background:var(--bg);color:#1b2438;border-radius:8px;margin:8px 0;padding:10px 16px}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--red);color:#fff}
dialog{border:0;border-radius:14px;width:min(92vw,480px);padding:22px}
dialog::backdrop{background:rgba(13,26,56,.6)}
label{display:block;margin:10px 0;font-weight:600}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:8px;margin-top:3px;background:#fff}
footer{background:var(--navy2);color:#aab4cc;text-align:center;padding:22px 16px;border-top:3px solid var(--gold)}
#sheet{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,460px);background:var(--navy);color:#fff;border-radius:14px;border-top:4px solid var(--gold);padding:18px;text-align:center;box-shadow:0 12px 40px rgba(13,26,56,.5);display:none;z-index:50}
#sheet .f{font-size:1.8rem}
#sheet .a{font-size:1.5rem;color:var(--gold);margin:2px 0 10px;min-height:2.4rem}
#sheet .b{color:#cfd6e6;font-size:.95rem;margin-bottom:8px;min-height:1.4rem}
#sheet button{background:var(--gold);color:var(--navy2)}
#sheet .sec{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}

  projectId: "frensh-db2c7",
  storageBucket: "frensh-db2c7.firebasestorage.app",

};

/* ============================================== */

const fb = initializeApp(firebaseConfig);
initializeAppCheck(fb, { provider: new ReCaptchaEnterpriseProvider("6Ld8J_MtAAAAAGpc-4AUO_qWeErr0Gyctgj2mse1"), isTokenAutoRefreshEnabled: true });
const auth = getAuth(fb), db = getFirestore(fb);
const gem = getGenerativeModel(getAI(fb, { backend: new GoogleAIBackend() }), { model: "gemini-3.8-flash", generationConfig: { responseMimeType: "application/json" } });
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let user = null, admin = false, editor = false;

/* ---------- Auth ---------- */
function authDialog() {
  const d=document.createElement("dialog");
  d.innerHTML=`<form id="authForm"><h3 class="fr">Connexion</h3><p class="mut">سجل دخولك أو أنشئ حسابًا جديدًا</p><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input name="password" type="password" minlength="6" required autocomplete="current-password"></label><label id="fullNameLabel" style="display:none">الاسم الكامل<input name="fullName" autocomplete="name"></label><div class="row"><button type="submit" id="loginSubmit">تسجيل الدخول</button><button type="button" class="sec" id="toggleAuth">إنشاء حساب جديد</button><button type="button" class="sec" id="closeAuth">إلغاء</button></div><p id="authError" class="danger"></p></form>`;
  document.body.appendChild(d); d.showModal(); let signup=false;
  const title=d.querySelector("h3"), submit=d.querySelector("#loginSubmit"), toggle=d.querySelector("#toggleAuth"), name=d.querySelector("#fullNameLabel"), error=d.querySelector("#authError");
  toggle.onclick=()=>{signup=!signup; title.textContent=signup?"إنشاء حساب":"Connexion"; submit.textContent=signup?"إنشاء الحساب":"تسجيل الدخول"; toggle.textContent=signup?"لدي حساب بالفعل":"إنشاء حساب جديد"; name.style.display=signup?"block":"none"; d.querySelector('[name="password"]').autocomplete=signup?"new-password":"current-password";};
  d.querySelector("#closeAuth").onclick=()=>{d.close();d.remove();};
  d.querySelector("form").onsubmit=async e=>{e.preventDefault(); error.textContent=""; const fd=new FormData(e.target), email=String(fd.get("email")).trim(), password=String(fd.get("password")), fullName=String(fd.get("fullName")||"").trim(); if(signup&&!fullName)return error.textContent="اكتب اسمك الكامل أولًا"; submit.disabled=true; submit.textContent="جاري التحميل..."; try{let cred;if(signup){cred=await createUserWithEmailAndPassword(auth,email,password); await updateProfile(cred.user,{displayName:fullName}); await setDoc(doc(db,"users",cred.user.uid),{name:fullName,email,photo:"",created:serverTimestamp(),last:serverTimestamp()},{merge:true});}else{cred=await signInWithEmailAndPassword(auth,email,password); await ensureFullName(cred.user);} d.close();d.remove();}catch(err){error.textContent=err.code==="auth/email-already-in-use"?"البريد مستخدم بالفعل":err.code==="auth/invalid-credential"?"البريد أو كلمة المرور غير صحيحة":err.code==="auth/weak-password"?"كلمة المرور يجب أن تكون 6 أحرف على الأقل":"تعذر تسجيل الدخول، راجع البيانات";submit.disabled=false;submit.textContent=signup?"إنشاء الحساب":"تسجيل الدخول";}};
}
async function ensureFullName(u){ const snap=await getDoc(doc(db,"users",u.uid)); const old=snap.data()?.name||u.displayName||""; if(old.trim().split(/\s+/).length>=2)return; await new Promise(resolve=>form("أكمل بياناتك",[{n:"name",l:"الاسم الكامل",v:old}],async v=>{const name=v.name.trim(); if(name.split(/\s+/).length<2)return alert("اكتب الاسم الأول واسم العائلة"); await updateProfile(u,{displayName:name}); await setDoc(doc(db,"users",u.uid),{name,email:u.email,last:serverTimestamp()},{merge:true}); resolve();})); }
$("#auth").onclick = () => user ? signOut(auth) : authDialog();
$("#adminEntry").onclick = async () => { try { const cred=await signInWithPopup(auth,new GoogleAuthProvider()); if(cred.user.email!==ADMIN_EMAIL){ await signOut(auth); alert("هذه الأيقونة مخصصة لحساب الإدارة فقط"); } } catch(e) { if(e.code!=="auth/popup-closed-by-user") alert("تعذر فتح دخول الإدارة"); } };
$("#menuToggle").onclick = () => { const n=$("#menuToggle").parentElement; n.classList.toggle("open"); const open=n.classList.contains("open"); $("#menuToggle").textContent=open?"✕":"☰"; $("#menuToggle").setAttribute("aria-expanded",String(open)); };
document.querySelectorAll("nav a").forEach(a=>a.addEventListener("click",()=>{const n=a.parentElement;n.classList.remove("open");if($("#menuToggle")){ $("#menuToggle").textContent="☰"; $("#menuToggle").setAttribute("aria-expanded","false"); }}));

$("#n3").onclick = () => groupsPage();
$("#n4").onclick = () => askPage();

if (localStorage.getItem("fr-theme") === "night") { document.body.classList.add("night"); $("#themeToggle").textContent="☀"; }
onAuthStateChanged(auth, async u => {
  user = u; admin = !!u && u.email === ADMIN_EMAIL;
  $("#who").textContent = u ? u.displayName : "";
  $("#n6").style.display = admin ? "" : "none";
  $("#auth").textContent = u ? "خروج" : "تسجيل الدخول";
  if (u) { const existing = await getDoc(doc(db,"users",u.uid)); if (existing.data()?.disabled) { alert("هذا الحساب متوقف من الإدارة"); await signOut(auth); return; } if (!existing.data()?.name || existing.data()?.name.trim().split(/\s+/).length < 2) await ensureFullName(u); await setDoc(doc(db, "users", u.uid), { name: u.displayName, email: u.email, photo: u.photoURL, last: serverTimestamp() }, { merge: true }); }
  editor = admin; $("#n5").style.display = admin ? "" : "none";
  if (u) {
    editor = admin || (await getDoc(doc(db, "users", u.uid))).data()?.role === "assistant";
    if (admin) await setDoc(doc(db, "groups", "general"), { name: "الجروب العام", public: true, members: [] }, { merge: true });
  }
  subjects();

/* ---------- أدوات ---------- */
const list = async (col, field, val) => {
  const q = field ? query(collection(db, col), where(field, "==", val)) : collection(db, col);
  return (await getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.created?.seconds || 0) - (b.created?.seconds || 0));
};
function form(title, fields, cb) {
  const d = document.createElement("dialog");
  d.innerHTML = `<form><h3>${title}</h3>${fields.map(f => `<label>${f.l}${
    f.t === "area" ? `<textarea name="${f.n}" rows="6"></textarea>` :
    f.t === "chk" ? `<div style="max-height:200px;overflow:auto">${f.o.map(o => `<div><input type="checkbox" name="${f.n}" value="${o[0]}" style="width:auto"> ${esc(o[1])}</div>`).join("")}</div>` : f.t === "sel" ? `<select name="${f.n}">${f.o.map(o => `<option value="${o[0]}">${o[1]}</option>`).join("")}</select>` :
    `<input name="${f.n}">`}</label>`).join("")}
    <div class="row"><button>حفظ</button><button type="button" class="sec">إلغاء</button></div></form>`;
  document.body.appendChild(d);
  fields.forEach(f => { const el = d.querySelector(`[name="${f.n}"]`); if (el && f.v != null && f.t !== "chk") el.value = f.v; });
  d.showModal();
  d.querySelector(".sec").onclick = () => { d.close(); d.remove(); };
  d.querySelector("form").onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(e.target), v = Object.fromEntries(fd); fields.filter(f => f.t === "chk").forEach(f => v[f.n] = fd.getAll(f.n));
    d.close(); d.remove(); await cb(v);
  };

async function gradeEssay(q, answer) {

  const x = JSON.parse((await gem.generateContent(prompt)).response.text());

  app.innerHTML = `<div class="row"><h3 class="sh" style="flex:1;margin:0">درجات ومحاولات الطلاب</h3><button class="sec" id="refreshGrades">تحديث</button><button class="sec" id="exportGrades">تصدير CSV</button></div><div class="dashboard"><div class="metric"><b>${new Set(answers.map(x=>x.uid)).size}</b><small>طلاب لديهم محاولات</small></div><div class="metric"><b>${answers.length}</b><small>إجمالي الإجابات</small></div><div class="metric"><b>${max ? Math.round(total/max*100) : 0}%</b><small>متوسط الأداء العام</small></div><div class="metric"><b>${new Set(answers.map(x=>x.lessonId)).size}</b><small>دروس تم حلها</small></div></div><div class="grid">${answers.map(a => { const u=um.get(a.uid)||{}, q=qm.get(a.questionId)||{}, l=lm.get(a.lessonId)||{}; return `<div class="q"><b>${esc(u.name || a.uid)}</b><small class="mut"> ${esc(u.email || "")}</small><hr><div>${esc(q.q || "سؤال محذوف")}</div><small class="mut">الدرس: ${esc(l.title || "غير معروف")}</small><p><span class="score">${Number(a.score||0)}/${Number(q.points || (q.type === "essay" ? 10 : 1))}</span>${a.correct !== undefined ? (a.correct ? " إجابة صحيحة" : " إجابة خاطئة") : ""}</p>${a.feedback ? `<div class="mut">${esc(a.feedback)}</div>` : ""}<button class="sec" data-manual="${a.id}">تعديل الدرجة</button>${a.answer ? `<details><summary>إجابة الطالب</summary><p>${esc(a.answer)}</p></details>` : ""}</div>`; }).join("") || `<p class="mut">لا توجد محاولات بعد.</p>`}</div>`;
  app.querySelectorAll("[data-manual]").forEach(b=>b.onclick=()=>{const a=answers.find(x=>x.id===b.dataset.manual); form("تعديل الدرجة",[{n:"score",l:"الدرجة",v:String(a.score||0)},{n:"feedback",l:"ملاحظة",t:"area",v:a.feedback||""}],async v=>{await updateDoc(doc(db,"answers",a.id),{score:Number(v.score)||0,feedback:v.feedback||""}); gradesPage();});});
  $("#refreshGrades").onclick = gradesPage;
  $("#exportGrades").onclick = () => { const rows=[["الطالب","البريد","السؤال","الدرجة","الدرجة القصوى","الملاحظات"],...answers.map(a=>{const u=um.get(a.uid)||{},q=qm.get(a.questionId)||{};return [u.name||a.uid,u.email||q.q||"",q.q||"",a.score||0,q.points||1,a.feedback||""];})]; const csv="\ufeff"+rows.map(r=>r.map(x=>`"${String(x).replaceAll("\"","\"\"")}"`).join(",")).join("\n"), blob=new Blob([csv],{type:"text/csv;charset=utf-8"}), a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="grades.csv"; a.click(); URL.revokeObjectURL(a.href); };
}

async function linkAdminPassword(){
  if(!admin || !user) return alert("هذه الخاصية للأدمن فقط");
  const password=prompt("اكتب كلمة مرور الأدمن الجديدة (6 أحرف على الأقل):");
  if(!password || password.length<6) return alert("كلمة المرور يجب أن تكون 6 أحرف على الأقل");
  const again=prompt("اكتب كلمة المرور مرة أخرى للتأكيد:");
  if(password!==again) return alert("كلمتا المرور غير متطابقتين");
  try{ await linkWithCredential(user,EmailAuthProvider.credential(user.email,password)); alert("تم ربط كلمة المرور بحساب جوجل بنجاح. يمكنك الآن الدخول بالبريد وكلمة المرور."); }
  catch(e){ if(e.code==="auth/provider-already-linked") alert("حسابك مرتبط بكلمة مرور بالفعل."); else if(e.code==="auth/email-already-in-use") alert("هذا البريد مرتبط بحساب آخر."); else alert("تعذر ربط كلمة المرور. تأكد من تفعيل Email/Password في Firebase ثم حاول مرة أخرى."); }
}

  app.querySelectorAll("[data-pin]").forEach(b => b.onclick=async()=>{const x=ps.find(x=>x.id===b.dataset.pin); await updateDoc(doc(db,"groups",g.id,"posts",x.id),{pinned:!x.pinned}); groupView(g);});
  app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => form("رد", [{ n: "t", l: "ردك", t: "area" }], async v => { if (v.t.trim()) await post(g, v.t.trim(), b.dataset.r); groupView(g); }));
  app.querySelectorAll("[data-dp]").forEach(b => b.onclick = async () => {
    if (!confirm("حذف؟")) return;
    for (const p of ps.filter(p => p.id === b.dataset.dp || p.parent === b.dataset.dp)) if (can(p)) await deleteDoc(doc(db, "groups", g.id, "posts", p.id));

/* ---------- النطق والترجمة والكاردز ---------- */
function speak(t) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "fr-FR"; u.rate = .85;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith("fr")); if (v) u.voice = v; speechSynthesis.speak(u);
}
const hash = t => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
async function translate(w, sent) {
  const ref = doc(db, "translations", w + "_" + hash(sent)), s = await getDoc(ref);
  if (s.exists()) return s.data();
  const prompt = `أنت مدرس لغة فرنسية للمتحدثين بالعربية. الجملة: "${sent}"\nالكلمة: "${w}"\nأعد JSON فقط بالشكل: {"base": "الشكل الأصلي في القاموس (مصدر الفعل، ومفرد الاسم مع أداته مثل le livre)", "ar": "معنى الكلمة بالعربي حسب سياق الجملة تحديدًا، كلمة أو كلمتين", "note": "ملاحظة قصيرة جدًا بالعربي", "pos": "نوع الكلمة", "synonyms": ["مرادف فرنسي واحد"], "level": "A1 أو A2 أو B1"}`;
  const j = JSON.parse((await gem.generateContent(prompt)).response.text());
  if (!j.ar) throw 0;
  const out = { ar: j.ar, base: j.base || w, note: j.note || "", pos: j.pos || "", synonyms: Array.isArray(j.synonyms) ? j.synonyms.slice(0,3) : [], level: j.level || "" };
  await setDoc(ref, out); return out;
}
let cur;
function clickable(el, text) {
  el.innerHTML = "";
  text.split(/(?<=[.!?\n])/).forEach(sent => sent.split(/(\p{L}+)/gu).forEach(p => {
    if (/^\p{L}+$/u.test(p)) { const s = document.createElement("span"); s.className = "w"; s.textContent = p; s.onclick = () => openWord(p, sent); el.appendChild(s); }
    else el.appendChild(document.createTextNode(p));
  }));
}
async function openWord(w, sent) {
  cur = { fr: w.toLowerCase(), word: w, ar: "", ex: sent.trim() };
  $("#sheet .f").textContent = w; $("#sheet .a").textContent = "..."; $("#sheet .b").textContent = ""; $("#sv").textContent = "➕ أضف للكاردز"; $("#sheet").style.display = "block";
  speak(w);
  try { const t = await translate(cur.fr, cur.ex); cur.ar = t.ar; cur.fr = t.base || cur.fr; $("#sheet .a").textContent = t.ar; $("#sheet .b").textContent = [t.base.toLowerCase() !== w.toLowerCase() ? t.base : "", t.note, t.pos, t.level, t.synonyms?.length ? "مرادفات: " + t.synonyms.join(", ") : ""].filter(Boolean).join(" — "); } catch { $("#sheet .a").textContent = "الترجمة مش متاحة دلوقتي، جرب بعدين"; }
}
$("#sp").onclick = () => speak(cur.word || cur.fr);
$("#cl").onclick = () => $("#sheet").style.display = "none";
$("#sv").onclick = async e => {
  if (!cur?.ar) return;
  const ref = doc(db, "users", user.uid, "cards", cur.fr);
  if ((await getDoc(ref)).exists()) return e.target.textContent = "✔ موجودة قبل كده";
  await setDoc(ref, { fr: cur.fr, ar: cur.ar, example: cur.ex, box: 0, due: Date.now() }); e.target.textContent = "✔ اتضافت";
};

async function review() {
  $("#sheet").style.display = "none";
  const all = (await getDocs(collection(db, "users", user.uid, "cards"))).docs.map(d => ({ id: d.id, ...d.data() }));
  const q = all.filter(c => c.due <= Date.now()), DAYS = [0, 1, 3, 7, 14, 30];
  const show = () => {
    app.innerHTML = `<div class="row"><button class="sec" id="back">← المواد</button><h2 style="margin:0">كاردز الكلمات (${all.length})</h2></div><div id="rv" style="text-align:center"></div>`;
    $("#back").onclick = subjects;
    const r = $("#rv");
    if (!q.length) return r.innerHTML = `<p class="mut">${all.length ? "خلصت مراجعة النهارده 🎉" : "ضيف كلمات من الدروس الأول."}</p>`;
    const c = q[0];
    r.innerHTML = `<div class="q"><div class="fr" style="font-size:2rem;font-weight:600">${esc(c.fr)}</div><div class="fr mut">${esc(c.example)}</div>
      <div id="ar" style="font-size:1.6rem;min-height:2.4rem"></div><button id="s">🔊</button> <button id="f">اظهر المعنى</button>
      <div id="b" style="display:none;margin-top:10px"><button class="del" id="no">مش فاكرها</button> <button id="yes">فاكرها</button></div><p class="mut">متبقي: ${q.length}</p></div>`;
    speak(c.fr); $("#s").onclick = () => speak(c.fr);
    $("#f").onclick = () => { $("#ar").textContent = c.ar; $("#b").style.display = "block"; };
    const ref = doc(db, "users", user.uid, "cards", c.id);
    $("#yes").onclick = async () => { const b = Math.min((c.box || 0) + 1, 5); await updateDoc(ref, { box: b, due: Date.now() + DAYS[b] * 864e5 }); q.shift(); show(); };
    $("#no").onclick = async () => { await updateDoc(ref, { box: 0, due: Date.now() }); q.push(q.shift()); show(); };
  };
  show();
}

/* Premium interactions */
const motionRoot = document.body;
let motionFrame;
document.addEventListener("mousemove", e => {
  cancelAnimationFrame(motionFrame);
  motionFrame = requestAnimationFrame(() => {
    const x = (e.clientX / innerWidth - .5), y = (e.clientY / innerHeight - .5);
    motionRoot.style.setProperty("--mx", `${x * 18}px`); motionRoot.style.setProperty("--my", `${y * 18}px`);
    const card = e.target.closest(".tile");
    if (card && innerWidth > 760) {
      const r = card.getBoundingClientRect(), rx = ((e.clientY-r.top)/r.height-.5)*-5, ry=((e.clientX-r.left)/r.width-.5)*7;
      card.style.transform = `translateY(-8px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    }
  });
});
document.addEventListener("mouseleave", () => document.querySelectorAll(".tile").forEach(c => c.style.transform = ""));
const revealObserver = new MutationObserver(() => {
  document.querySelectorAll(".item,.tile,.q,.hero,.text").forEach((el,i) => { if (!el.dataset.motion) { el.dataset.motion="1"; el.classList.add("reveal"); el.style.animationDelay = `${Math.min(i*35,280)}ms`; } });
});
revealObserver.observe(document.querySelector("#app"), {childList:true,subtree:true});

</script>
